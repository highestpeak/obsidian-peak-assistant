<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peak Assistant Planned Requirements</title>
  <style>
    :root {
      --bg: #f7f8f4;
      --paper: #ffffff;
      --ink: #17221d;
      --muted: #69766f;
      --line: #d9e1d8;
      --green: #1f6b52;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.72; }
    a { color: var(--green); text-decoration: none; font-weight: 760; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .page { width: min(840px, calc(100vw - 64px)); margin: 0 auto; padding: 48px 0 72px; }
    header { padding: 8px 0 34px; border-bottom: 1px solid var(--line); }
    .eyebrow { color: var(--green); font-size: 13px; font-weight: 820; }
    h1 { margin: 14px 0 16px; font-size: 42px; line-height: 1.1; }
    h2 { margin: 0 0 12px; font-size: 28px; line-height: 1.2; }
    p { margin: 0; }
    .subtitle { max-width: 760px; color: var(--muted); font-size: 18px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; color: var(--muted); font-size: 13px; }
    .meta span { padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); }
    .nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; font-size: 14px; }
    section { padding: 40px 0; border-bottom: 1px solid var(--line); }
    .empty-state {
      margin-top: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
      box-shadow: 0 10px 24px rgba(23, 34, 29, 0.04);
    }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 17px; }
    @media (max-width: 720px) {
      .page { width: min(100vw - 24px, 840px); }
      h1 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">Peak Assistant Planned Requirements</div>
      <h1>当前没有开放的局部需求。</h1>
      <p class="subtitle">本页只登记尚未实现、且尚未升级为正式规格或 Roadmap 里程碑的局部需求。需求完成、合并或撤销后即从本页移除。</p>
      <div class="meta">
        <span>Open: 0</span>
        <span>Updated: 2026-08-02</span>
      </div>
      <nav class="nav" aria-label="cross document navigation">
        <a href="index.html">← 文档总索引</a>
        <a href="roadmap.html">Roadmap</a>
        <a href="progress.md">Progress</a>
      </nav>
    </header>

    <section id="active-planned">
      <h2>开放需求</h2>
      <div class="empty-state">
        <strong>暂无待实现的小需求</strong>
        新的局部需求可以继续登记在这里；形成正式设计后移入对应规格或 Roadmap。
      </div>
    </section>
  </main>
</body>
</html>
