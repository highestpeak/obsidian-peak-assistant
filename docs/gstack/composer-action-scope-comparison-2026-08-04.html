.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;composer-action-scope-comparison&quot;&gt;
  &lt;style&gt;
    #composer-action-scope-comparison {
      color-scheme: light dark;
      --cm-canvas: light-dark(#eef1f6, #15171c);
      --cm-paper: light-dark(#ffffff, #22252b);
      --cm-surface: light-dark(#f7f8fa, #2a2d34);
      --cm-text: light-dark(#263248, #edf1f7);
      --cm-muted: light-dark(#747e8e, #aeb6c3);
      --cm-border: light-dark(#d9dee8, #3d424d);
      --cm-accent: light-dark(#8b5cf6, #a78bfa);
      --cm-accent-soft: light-dark(#f1ebff, #382c55);
      --cm-shadow: light-dark(rgba(29, 38, 54, 0.14), rgba(0, 0, 0, 0.44));
      width: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      color: var(--cm-text);
    }

    #composer-action-scope-comparison * {
      box-sizing: border-box;
    }

    #composer-action-scope-comparison .cm-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    #composer-action-scope-comparison .cm-scheme {
      overflow: hidden;
      border: 1px solid var(--cm-border);
      border-radius: 12px;
      background: var(--cm-canvas);
      box-shadow: 0 10px 28px var(--cm-shadow);
    }

    #composer-action-scope-comparison .cm-scheme-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--cm-border);
    }

    #composer-action-scope-comparison .cm-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 500;
    }

    #composer-action-scope-comparison .cm-code {
      flex: 0 0 auto;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--cm-accent-soft);
      color: var(--cm-accent);
    }

    #composer-action-scope-comparison .cm-caption {
      max-width: 52%;
      color: var(--cm-muted);
      text-align: right;
    }

    #composer-action-scope-comparison .cm-editor {
      min-height: 324px;
      padding: 18px 16px 16px;
      background: var(--cm-paper);
    }

    #composer-action-scope-comparison .cm-doc-heading {
      margin-bottom: 12px;
      font-weight: 500;
    }

    #composer-action-scope-comparison .cm-list {
      position: relative;
      padding: 26px 7px 7px;
      border: 1px solid transparent;
      border-radius: 9px;
      transition: border-color 120ms ease, background 120ms ease;
    }

    #composer-action-scope-comparison .cm-list:hover,
    #composer-action-scope-comparison .cm-list[data-selected=&quot;true&quot;] {
      border-color: var(--cm-border);
      background: color-mix(in srgb, var(--cm-surface) 72%, transparent);
    }

    #composer-action-scope-comparison .cm-row {
      position: relative;
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      min-height: 38px;
      padding: 3px 4px 3px 7px;
      border-radius: 7px;
      transition: background 100ms ease, box-shadow 100ms ease;
    }

    #composer-action-scope-comparison .cm-row:hover,
    #composer-action-scope-comparison .cm-row[data-selected=&quot;true&quot;] {
      background: var(--cm-surface);
      box-shadow: inset 3px 0 0 var(--cm-accent);
    }

    #composer-action-scope-comparison .cm-bullet {
      color: var(--cm-muted);
    }

    #composer-action-scope-comparison .cm-row-text,
    #composer-action-scope-comparison .cm-row-select {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    #composer-action-scope-comparison .cm-row-select {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: 16px minmax(0, 1fr);
      align-items: center;
      width: 100%;
      min-height: 34px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    #composer-action-scope-comparison .cm-icon-button,
    #composer-action-scope-comparison .cm-list-button,
    #composer-action-scope-comparison .cm-scope-button,
    #composer-action-scope-comparison .cm-action,
    #composer-action-scope-comparison .cm-palette-trigger {
      border: 1px solid var(--cm-border);
      border-radius: 7px;
      background: var(--cm-paper);
      color: var(--cm-text);
      font: inherit;
      cursor: pointer;
    }

    #composer-action-scope-comparison .cm-icon-button {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      padding: 0;
      color: var(--cm-accent);
      opacity: 0.42;
      transition: opacity 100ms ease, background 100ms ease;
    }

    #composer-action-scope-comparison .cm-row:hover .cm-icon-button,
    #composer-action-scope-comparison .cm-icon-button:focus-visible,
    #composer-action-scope-comparison .cm-icon-button[aria-expanded=&quot;true&quot;] {
      opacity: 1;
      background: var(--cm-accent-soft);
    }

    #composer-action-scope-comparison .cm-list-button,
    #composer-action-scope-comparison .cm-palette-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 29px;
      padding: 4px 8px;

      position: absolute;
      top: 4px;
      right: 6px;
      color: var(--cm-muted);
      opacity: 0.58;

    #composer-action-scope-comparison .cm-top-right:focus-visible,
    #composer-action-scope-comparison .cm-top-right[aria-expanded=&quot;true&quot;] {
      opacity: 1;
    }

    #composer-action-scope-comparison .cm-left-handle {
      position: absolute;
      top: 40%;
      left: -12px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 27px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--cm-border);
      border-radius: 7px;
      background: var(--cm-paper);
      color: var(--cm-muted);
      cursor: pointer;
      opacity: 0.45;
    }

    #composer-action-scope-comparison .cm-list:hover .cm-left-handle,
    #composer-action-scope-comparison .cm-left-handle:focus-visible,
    #composer-action-scope-comparison .cm-left-handle[aria-expanded=&quot;true&quot;] {
      opacity: 1;
    }

    #composer-action-scope-comparison .cm-menu,
    #composer-action-scope-comparison .cm-toolbar {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--cm-border);
      border-radius: 9px;
      background: var(--cm-paper);
      box-shadow: 0 10px 24px var(--cm-shadow);
    }

    #composer-action-scope-comparison .cm-menu[hidden] {
      display: none;
    }

    #composer-action-scope-comparison .cm-menu-head,
    #composer-action-scope-comparison .cm-toolbar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--cm-muted);
    }

    #composer-action-scope-comparison .cm-menu-title,
    #composer-action-scope-comparison .cm-current-target {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    #composer-action-scope-comparison .cm-scope-switch {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    #composer-action-scope-comparison .cm-scope-button {
      min-height: 28px;
      padding: 4px 8px;
      color: var(--cm-muted);
    }

    #composer-action-scope-comparison .cm-scope-button[aria-pressed=&quot;true&quot;] {
      border-color: var(--cm-accent);
      background: var(--cm-accent-soft);
      color: var(--cm-accent);
    }

    #composer-action-scope-comparison .cm-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #composer-action-scope-comparison .cm-action {
      min-height: 29px;
      padding: 4px 8px;
    }

    #composer-action-scope-comparison .cm-action:hover {
      border-color: var(--cm-accent);
      background: var(--cm-accent-soft);
    }

    #composer-action-scope-comparison .cm-divider {
      height: 1px;
      margin: 9px 0;
      background: var(--cm-border);
    }

    #composer-action-scope-comparison .cm-result {
      min-height: 22px;
      margin-top: 10px;
      color: var(--cm-muted);
      text-align: center;
    }

    #composer-action-scope-comparison .cm-result strong {
      color: var(--cm-text);
      font-weight: 500;
    }

    #composer-action-scope-comparison .cm-context-row {
      cursor: pointer;
    }

    #composer-action-scope-comparison .cm-palette-trigger {
      width: 100%;
      justify-content: center;
      margin-top: 10px;
      color: var(--cm-accent);
    }

    #composer-action-scope-comparison .cm-search {
      width: 100%;
      min-height: 34px;
      margin-bottom: 8px;
      padding: 6px 9px;
      border: 1px solid var(--cm-border);
      border-radius: 7px;
      background: var(--cm-paper);
      color: var(--cm-text);
      font: inherit;
    }

    #composer-action-scope-comparison .cm-empty {
      padding: 8px 2px 2px;
      color: var(--cm-muted);
    }

    #composer-action-scope-comparison .cm-empty[hidden] {
      display: none;
    }

    @media (max-width: 660px) {
      #composer-action-scope-comparison .cm-grid {
        grid-template-columns: 1fr;
      }

      #composer-action-scope-comparison .cm-caption {
        max-width: 48%;
      }

      #composer-action-scope-comparison .cm-left-handle {
        left: -6px;
      }
    }
  &lt;/style&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;composer-action-scope-comparison&#x27;);
      const schemes = Array.from(root.querySelectorAll(&#x27;[data-scheme]&#x27;));

      const getScheme = (element) =&gt; element.closest(&#x27;[data-scheme]&#x27;);

      const applyPaletteFilter = (scheme) =&gt; {
        const search = scheme.querySelector(&#x27;[data-f-search]&#x27;);
        if (!search) return;
        const query = search.value.trim().toLocaleLowerCase();
        const activePanel = scheme.querySelector(`[data-scope-panel=&quot;${scheme.dataset.scope}&quot;]`);
        let visibleCount = 0;
        activePanel.querySelectorAll(&#x27;.cm-palette-action&#x27;).forEach((button) =&gt; {
          const visible = button.textContent.toLocaleLowerCase().includes(query);
          button.hidden = !visible;
          if (visible) visibleCount += 1;
        });
        scheme.querySelector(&#x27;[data-f-empty]&#x27;).hidden = visibleCount !== 0;
      };

      const setPanels = (scheme, scope) =&gt; {
        scheme.dataset.scope = scope;
        scheme.querySelectorAll(&#x27;[data-scope-panel]&#x27;).forEach((panel) =&gt; {
          panel.hidden = panel.dataset.scopePanel !== scope;
        });
        scheme.querySelectorAll(&#x27;[data-set-scope]&#x27;).forEach((button) =&gt; {
          button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.setScope === scope));
        });
        const targetLabel = scheme.querySelector(&#x27;[data-target-label]&#x27;);
        if (targetLabel) {
          const target = scope === &#x27;item&#x27; ? scheme.dataset.currentTarget : &#x27;整个列表&#x27;;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

    const delay =
