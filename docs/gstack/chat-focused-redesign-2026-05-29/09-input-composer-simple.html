<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peak Chat - Simple Input Composer</title>
  <style>
    :root {
      --text: #111827;
      --muted: #6b7280;
      --faint: #9aa3b5;
      --line: #dfe7f2;
      --purple: #7c3aed;
      --purple-soft: #f4eeff;
      --green: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1180px;
      min-height: 500px;
      background: #fff;
      color: var(--text);
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 34px 38px;
    }
    .project-row {
      height: 44px;
      border: 1px dashed #cfd8e6;
      border-radius: 8px;
      color: #707b8f;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      margin-bottom: 20px;
    }
    .project-row svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .project-row .action { margin-left: auto; color: #303846; font-weight: 500; }
    .project-row .close { color: #8993a5; }
    .composer {
      border: 1.5px solid var(--purple);
      border-radius: 10px;
      min-height: 188px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 0 3px rgba(124,58,237,.05);
      overflow: hidden;
    }
    .textarea {
      flex: 1;
      padding: 22px 24px 18px;
      font-size: 20px;
      color: #111827;
      min-height: 112px;
    }
    .enhance {
      color: var(--muted);
      font-size: 12px;
      padding: 0 24px 9px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .enhance svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .enhance .dismiss { color: #303846; margin-left: 6px; }
    .footer {
      height: 56px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
    }
    .left, .center, .right { display: flex; align-items: center; gap: 10px; }
    .icon {
      width: 30px; height: 30px;
      border-radius: 7px;
      display: grid; place-items: center;
      color: #5e687a;
    }
    .icon.active {
      color: var(--purple);
      background: var(--purple-soft);
      position: relative;
    }
    .icon.active::after {
      content: "";
      position: absolute;
      top: 5px; right: 5px;
      width: 6px; height: 6px;
      border-radius: 999px;
      background: var(--purple);
    }
    .icon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .divider { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
    .status {
      color: #7b8495;
      font-size: 12px;
      white-space: nowrap;
    }
    .status strong { color: #303846; font-weight: 600; }
    .status .ok { color: var(--green); }
    .mode {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #303846;
      font-size: 13px;
    }
    .mode svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .model { color: #657085; white-space: nowrap; }
    .usage {
      color: var(--green);
      background: #eaf8ef;
      border-radius: 7px;
      padding: 7px 10px;
      font-weight: 600;
    }
    .send {
      width: 34px; height: 34px; border-radius: 8px;
      display: grid; place-items: center;
      color: #5b6578;
      background: #f4f6fa;
    }
    .send svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  </style>
</head>
<body>
  <div class="project-row">
    <svg viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    <span>This conversation is growing. Convert to a project for better organization?</span>
    <span class="action">Convert to project</span>
    <span class="close">x</span>
  </div>

  <section class="composer">
    <div class="textarea">[[人物分析/</div>
    <div class="enhance">
      <svg viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5"/><path d="M18 4l2 2M4 18l2 2"/></svg>
      <span>Enhance prompt?</span>
      <span class="dismiss">dismiss</span>
    </div>
    <div class="footer">
      <div class="left">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 11.5L12 20a6 6 0 0 1-8.5-8.5L12 3a4 4 0 0 1 5.5 5.5L9 17a2 2 0 0 1-3-3l8-8"/></svg></span>
        <span class="icon active"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg></span>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="12" cy="18" r="2"/></svg></span>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-10 10H4v-6z"/><path d="M13 5l6 6"/></svg></span>
      </div>
      <div class="center">
        <span class="status"><strong>Context</strong>: current note · <span class="ok">vault on</span> · web off</span>
      </div>
      <div class="right">
        <span class="mode"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>Chat</span>
        <span class="model">Auto (openai/gpt-5-mini)</span>
        <span class="usage">Used 0</span>
        <span class="send"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></span>
      </div>
    </div>
  </section>
</body>
</html>
