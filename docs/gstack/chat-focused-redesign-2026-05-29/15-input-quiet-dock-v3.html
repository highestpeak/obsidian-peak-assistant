<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input V3 A Quiet Dock</title>
<link rel="stylesheet" href="chat-input-message-v3.css">
</head>
<body>
<main class="stage">
  <section class="quiet-composer" data-focus="true">
    <div class="quiet-text">
      [[people analysis/
      <div class="quiet-context">
        <span style="color:var(--pk-accent-text)">Enhance prompt?</span>
        <span>dismiss</span>
      </div>
    </div>
    <footer class="quiet-footer">
      <button class="icon-btn" title="Add">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" title="Attach">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.4 11.6-8.5 8.5a5 5 0 0 1-7.1-7.1l9.2-9.2a3.5 3.5 0 0 1 4.9 4.9l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/></svg>
      </button>
      <button class="icon-btn" title="Context">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>
      </button>
      <button class="icon-btn" title="Output and tools">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M2 14h4M10 8h4M18 16h4"/></svg>
      </button>
      <div class="quiet-footer-right">
        <button class="state-capsule">
          <strong>Chat</strong>
          <span>Auto model</span>
          <span class="ctx">0 ctx</span>
        </button>
        <button class="icon-btn" title="Voice">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        </button>
        <button class="send" title="Send">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
    </footer>
  </section>
</main>
</body>
</html>
