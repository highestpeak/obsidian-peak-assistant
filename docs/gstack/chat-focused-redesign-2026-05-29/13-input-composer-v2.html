<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak Chat Input Composer V2</title>
<link rel="stylesheet" href="chat-component-v2.css">
</head>
<body>
<main class="stage">
  <section class="composer-wrap" aria-label="Input composer refinement">
    <div class="project-nudge">
      <span>
        <svg class="icon" style="vertical-align:middle;margin-right:8px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h7l2 2h9v10H3z"/></svg>
        This conversation is growing. Convert it to a project for better organization?
      </span>
      <span style="display:flex;align-items:center;gap:14px;color:var(--pk-text-strong)">Convert to project <span style="font-size:18px;color:var(--pk-text-muted)">x</span></span>
    </div>

    <div class="composer">
      <div class="composer-body">
        [[people analysis/
        <div class="enhance-row">
          <span style="color:var(--pk-accent-text)">Enhance prompt?</span>
          <span>dismiss</span>
        </div>
      </div>

      <div class="composer-footer">
        <div class="footer-left">
          <button class="icon-btn" title="Add">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-btn" title="Attach">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.4 11.6-8.5 8.5a5 5 0 0 1-7.1-7.1l9.2-9.2a3.5 3.5 0 0 1 4.9 4.9l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <button class="icon-btn" data-active="true" title="Sources and context">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>
          </button>
          <button class="icon-btn" title="Output">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M2 14h4M10 8h4M18 16h4"/></svg>
          </button>
          <button class="icon-btn" title="Tools">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14.7 6.3 3 3"/><path d="M2 22l7-7"/><path d="m14 7 3-3a2.1 2.1 0 0 1 3 3l-3 3"/><path d="M14 7 8 13l3 3 6-6"/></svg>
          </button>
        </div>

        <div class="footer-right">
          <button class="mode-select">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
            Chat
          </button>
          <button class="model-select">Auto model: gpt-5-mini</button>
          <button class="usage-pill">0 ctx</button>
          <button class="icon-btn" title="Voice">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
          </button>
          <button class="send-btn" title="Send">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
