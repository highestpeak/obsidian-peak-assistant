<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input V3 B Command Strip</title>
<link rel="stylesheet" href="chat-input-message-v3.css">
</head>
<body>
<main class="stage">
  <section class="command-shell">
    <div class="command-bar">
      <span class="command-scope">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>
        Chat
      </span>
      <span style="color:var(--pk-text-muted);font-size:13px">Current note + vault context</span>
      <div class="command-meta">
        <span>Auto model: gpt-5-mini</span>
        <span style="color:var(--pk-accent-text);font-family:var(--pk-mono)">0 ctx</span>
      </div>
    </div>
    <div class="command-editor">
      <div class="command-prompt">[[people analysis/</div>
      <footer class="command-footer">
        <button class="icon-btn" title="Add"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" title="Attach"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.4 11.6-8.5 8.5a5 5 0 0 1-7.1-7.1l9.2-9.2a3.5 3.5 0 0 1 4.9 4.9l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/></svg></button>
        <button class="icon-btn" title="Context"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg></button>
        <button class="icon-btn" title="Output"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M2 14h4M10 8h4M18 16h4"/></svg></button>
        <button class="icon-btn" title="Tools"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14.7 6.3 3 3"/><path d="M2 22l7-7"/><path d="m14 7 3-3a2.1 2.1 0 0 1 3 3l-3 3"/><path d="M14 7 8 13l3 3 6-6"/></svg></button>
        <div class="command-footer-right">
          <span style="font-size:12px;color:var(--pk-text-subtle)">Enter to send · Shift Enter newline</span>
          <button class="send" title="Send"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
        </div>
      </footer>
    </div>
  </section>
</main>
</body>
</html>
