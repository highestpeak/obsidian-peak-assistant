<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peak · My Content design mock</title>
  <style>
    :root { color-scheme:light; --bg:#f5f5f3; --surface:#fff; --surface-2:#fafaf8; --line:#e3e3df; --text:#282825; --muted:#73736d; --subtle:#989890; --accent:#6557c8; --accent-soft:#f0edff; --green:#317259; --green-soft:#e9f4ed; --radius:8px; --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; } html,body { width:100%; height:100%; margin:0; overflow:hidden; } body { color:var(--text); background:var(--bg); font:13px/1.45 var(--font); } button,input { color:inherit; font:inherit; } button { cursor:pointer; } svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .app { display:grid; grid-template-rows:40px 56px minmax(0,1fr); width:100vw; height:100vh; background:var(--surface); } .tabbar { display:flex; align-items:stretch; padding-left:48px; border-bottom:1px solid #d8d8d4; background:#ececea; } .tab { display:flex; align-items:center; gap:8px; min-width:208px; padding:0 14px; border-right:1px solid #d8d8d4; color:var(--muted); text-decoration:none; } .tab.active { color:var(--text); background:#fff; border-top:2px solid var(--accent); font-weight:650; }
    .topbar { display:flex; align-items:center; gap:12px; padding:0 18px; border-bottom:1px solid var(--line); } .topbar strong { font-size:16px; } .topbar span { color:var(--muted); }
    .body { display:grid; grid-template-columns:minmax(370px,430px) minmax(520px,1fr); min-height:0; } .list,.detail { min-height:0; overflow:auto; } .list { border-right:1px solid var(--line); } .detail { background:#fff; }
    .list-head { position:sticky; top:0; z-index:2; padding:14px 16px 12px; border-bottom:1px solid var(--line); background:#fff; } .list-head strong { display:block; font-size:15px; } .list-head span { display:block; margin-top:2px; color:var(--muted); } .search { position:relative; display:block; margin-top:11px; } .search svg { position:absolute; top:9px; left:10px; color:var(--subtle); pointer-events:none; } .search input { width:100%; height:34px; padding:0 12px 0 34px; border:1px solid var(--line); border-radius:7px; outline:0; background:var(--surface-2); } .search input:focus { border-color:#aaa1dc; background:#fff; box-shadow:0 0 0 2px var(--accent-soft); }
    .rows { padding:8px; } .family { padding:10px 8px 5px; color:var(--subtle); font-size:11px; font-weight:700; } .row { display:grid; grid-template-columns:32px minmax(0,1fr) auto; align-items:center; gap:10px; width:100%; min-height:59px; padding:9px; border:0; border-radius:7px; background:transparent; text-align:left; } .row:hover { background:var(--surface-2); } .row.active { background:var(--accent-soft); } .row-icon { display:grid; place-items:center; width:30px; height:30px; border:1px solid var(--line); border-radius:7px; color:var(--muted); background:#fff; } .row.active .row-icon { color:var(--accent); border-color:#d5cef7; } .row-copy { min-width:0; } .row-title,.row-meta { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .row-title { font-weight:650; } .row-meta { margin-top:2px; color:var(--muted); font-size:12px; }
    .pill { display:inline-flex; align-items:center; min-height:20px; padding:2px 7px; border-radius:99px; color:var(--green); background:var(--green-soft); font-size:10px; font-weight:700; white-space:nowrap; }
    .detail-head { padding:18px 24px 16px; border-bottom:1px solid var(--line); } .breadcrumbs { color:var(--subtle); font-size:11px; font-weight:600; } .detail-title { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-top:3px; } h1,h2,p { margin:0; } h1 { font-size:21px; letter-spacing:-.02em; } h2 { margin-bottom:10px; font-size:14px; } .detail-subtitle { max-width:760px; margin-top:4px; color:var(--muted); font-size:14px; } .content { max-width:920px; padding:20px 24px 48px; } .section + .section { margin-top:24px; }
    .notice { display:flex; gap:9px; align-items:flex-start; padding:11px 12px; border:1px solid #d9d2fa; border-radius:var(--radius); color:#51488f; background:var(--accent-soft); } .notice svg { flex:0 0 auto; margin-top:1px; } .facts { display:grid; grid-template-columns:190px minmax(0,1fr); margin:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; } .facts dt,.facts dd { min-height:40px; margin:0; padding:10px 12px; border-bottom:1px solid var(--line); } .facts dt { color:var(--muted); background:var(--surface-2); font-weight:600; } .facts dd { background:#fff; } .facts dt:last-of-type,.facts dd:last-of-type { border-bottom:0; } .action { min-height:32px; margin-top:12px; padding:0 11px; border:1px solid var(--accent); border-radius:7px; color:#fff; background:var(--accent); font-weight:650; } .empty { padding:28px 16px; color:var(--muted); text-align:center; } .mock-note { position:fixed; right:14px; bottom:12px; padding:3px 8px; border:1px solid var(--line); border-radius:5px; color:var(--subtle); background:rgba(255,255,255,.94); font:10px ui-monospace,monospace; }
  </style>
</head>
<body>
  <div class="app">
    <div class="tabbar"><a class="tab" href="../ai-control-center-2026-07-30/index.html"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 7.3v9.4L12 21l7.5-4.3V7.3z"/><path d="m8 11 2.5 2.5L16 8"/></svg>AI Control Center</a><div class="tab active"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h5"/></svg>My Content</div></div>
    <header class="topbar"><strong>My Content</strong><span>The things you created, accepted, or chose to save with Peak.</span></header>
    <div class="body"><section class="list"><div class="list-head"><strong>Your content</strong><span>Content stays in the feature and location where it belongs.</span><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="searchInput" type="search" placeholder="Search your Peak content…"></label></div><div class="rows" id="rows"></div></section><main class="detail" id="detail"></main></div>
  </div>
  <div class="mock-note">Design mock · no product data is changed</div>
  <script src="../ai-control-center-2026-07-30/output-catalog-data.js"></script>
  <script>
    const icons = { file:'<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h5"/></svg>', settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55v.09h-3v-.09A1.7 1.7 0 0 0 10.7 18.6a1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.06 15a1.7 1.7 0 0 0-1.55-1.03h-.09v-3h.09A1.7 1.7 0 0 0 7.06 9.94a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.55v-.09h3v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34L17.7 6l2.1 2.1-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1.03h.09v3h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg>' };
    const labels = { 'user-profile.markdown':['User Profile','Your long-term preferences and instructions for Peak.'],'prompt.override':['Prompt overrides','Your changes to built-in Prompts.'],'skill.vault-definition':['Vault skills','Reusable skills you created or installed.'],'project.brief':['Project Briefs','Project information that you intentionally maintain.'],'analysis.markdown-export':['Saved AI Search analyses','Analyses you explicitly saved as Markdown notes.'],'hub.materialized-note':['Materialized Hub notes','Hubs you explicitly turned into editable Vault notes.'],'ai-graph.markdown-export':['AI Graph exports','Graph results you explicitly exported.'],'artifact.dataview':['Dataview artifacts','Dataview files you asked Peak to create.'],'artifact.excalidraw':['Excalidraw artifacts','Drawings you asked Peak to create.'],'artifact.drawio':['Draw.io artifacts','Diagrams you asked Peak to create.'],'artifact.extract':['Editable extracts','Markdown extracts you chose to save.'],'artifact.reminder':['Reminder artifacts','Reminders you chose to create.'],'media.generated-attachment':['Generated media','Images, video, audio, or other media you asked Peak to create or edit.'],'document.accepted-writeback':['Accepted document changes','Changes you reviewed and accepted in your document.'],'artifact.native-file':['Native file artifacts','Canvas, HTML, PDF, or other files you chose to save.'] };
    const surfaces = { 'user-profile':'Profile settings', prompt:'AI Control Center', skill:'Skills', 'chat-project':'Projects', 'chat-artifact':'Chat Resources', 'ai-analysis':'AI Search', hub:'Vault Intelligence', 'ai-graph':'AI Graph', media:'Chat or Composer', 'copilot-composer':'Composer', 'composer-file-workspace':'File Workspace' };
    const items = (window.PEAK_OUTPUT_CATALOG ?? []).filter(item => item.outputClass === 'user-artifact').map(item => ({ ...item, title:labels[item.id]?.[0] ?? item.id, description:labels[item.id]?.[1] ?? 'Content you explicitly created or saved with Peak.' })).sort((a,b) => a.title.localeCompare(b.title));
    let activeItem = items[0]; const rows=document.getElementById('rows'), detail=document.getElementById('detail'), search=document.getElementById('searchInput');
    function family(item) { return ['user-profile.markdown','prompt.override','skill.vault-definition'].includes(item.id) ? 'Your settings content' : 'Saved work and files'; }
    function shownItems() { const query=search.value.trim().toLowerCase(); return query ? items.filter(item => [item.title,item.description,item.id].join(' ').toLowerCase().includes(query)) : items; }
    function renderRows() { const visible=shownItems(); const families=['Your settings content','Saved work and files']; rows.innerHTML=visible.length ? families.map(name => { const familyItems=visible.filter(item => family(item)===name); return familyItems.length ? `<div class="family">${name}</div>${familyItems.map(item => `<button class="row ${activeItem?.id===item.id?'active':''}" data-item="${item.id}"><span class="row-icon">${family(item)==='Your settings content'?icons.settings:icons.file}</span><span class="row-copy"><span class="row-title">${item.title}</span><span class="row-meta">${item.description}</span></span><span class="pill">Yours</span></button>`).join('')}` : ''; }).join('') : '<div class="empty">No saved content matches this search.</div>'; }
    function location(item) { if (item.path.scope==='user-selected') return 'The location you chose in your Vault'; if (item.path.scope==='ai-root') return 'Peak’s folder in your Vault'; return 'The original document or file you chose'; }
    function renderDetail() { const item=activeItem; const icon=family(item)==='Your settings content'?icons.settings:icons.file; detail.innerHTML=`<div class="detail-head"><div class="breadcrumbs">My Content · ${family(item)}</div><div class="detail-title"><h1>${item.title}</h1><span class="pill">Yours</span></div><p class="detail-subtitle">${item.description}</p></div><div class="content"><section class="section"><h2>What this is</h2><div class="notice">${icon}<span>This is content you created, accepted, or explicitly saved. It belongs to you; Peak does not replace it with an internal copy.</span></div></section><section class="section"><h2>Where you use it</h2><dl class="facts"><dt>Open and edit it in</dt><dd>${surfaces[item.owner] ?? 'Its original Peak feature'}</dd><dt>Saved location</dt><dd>${location(item)}</dd><dt>How it is created</dt><dd>${item.materializationPolicy==='explicit'?'Only after you choose to create, save, export, accept, or materialize it.':'Through the action that owns it.'}</dd></dl><button class="action" data-open>Open in original area</button></section></div>`; }
    document.addEventListener('click', event => { const row=event.target.closest('[data-item]'); if(row){ activeItem=items.find(item=>item.id===row.dataset.item); renderRows(); renderDetail(); return; } const action=event.target.closest('[data-open]'); if(action){ action.textContent='Opened in this mock'; action.disabled=true; } }); search.addEventListener('input', () => { const visible=shownItems(); if(visible.length && !visible.some(item=>item.id===activeItem?.id)) activeItem=visible[0]; renderRows(); renderDetail(); }); renderRows(); renderDetail();
  </script>
</body>
</html>
