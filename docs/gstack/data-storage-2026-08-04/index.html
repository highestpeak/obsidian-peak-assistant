te-columns:minmax(0,1fr) 12px minmax(0,1fr) auto; align-items:end; gap:6px; margin-top:7px; } .date-field { min-width:0; } .date-field span { display:block; margin:0 0 3px 1px; color:var(--subtle); font-size:10px; } .date-field input { width:100%; height:29px; min-width:0; padding:0 7px; border:1px solid var(--line); border-radius:6px; background:var(--surface-2); font-size:11px; } .date-separator { padding-bottom:6px; color:var(--subtle); text-align:center; } .clear-dates,.filter-reset,.filter-done { height:29px; padding:0 7px; border:0; color:var(--accent); background:transparent; font-size:11px; font-weight:650; white-space:nowrap; } .filter-footer { display:flex; justify-content:space-between; margin-top:12px; padding-top:9px; border-top:1px solid var(--line); } .filter-done { padding:0 10px; border:1px solid var(--accent); border-radius:6px; color:#fff; background:var(--accent); }

      { id:'dataview-artifact', date:'2026-08-01', timeBand:'Last 7 days', createdAt:'Aug 1, 17:03', type:'AI file', source:'Chat', title:'Recent research notes.md', description:'AI-created Dataview query', surface:'Chat resources', location:'Artifacts/Dataview/Recent research notes.md', creation:'You asked Chat to create a Dataview query.', reason:'Peak created a reusable Vault file, not just a chat response.' },
      { id:'excalidraw-artifact', date:'2026-08-01', timeBand:'Last 7 days', createdAt:'Aug 1, 15:31', type:'AI file', source:'Chat', title:'Discovery flow.excalidraw.md', description:'AI-created drawing', surface:'Chat resources', location:'Artifacts/Excalidraw/Discovery flow.excalidraw.md', creation:'You asked Chat to create an Excalidraw drawing.', reason:'This native drawing file was created by Peak.' },
      { id:'drawio-artifact', date:'2026-07-31', timeBand:'Last 7 days', createdAt:'Jul 31, 11:20', type:'AI file', source:'Chat', title:'System overview.drawio', description:'AI-created diagram', surface:'Chat resources', location:'Artifacts/DrawIO/System overview.drawio', creation:'You asked Chat to create a Draw.io diagram.', reason:'This native diagram file was created by Peak.' },

      { id:'user-profile', date:'2026-07-28', timeBand:'Earlier', createdAt:'Jul 28, 13:14', type:'Profile', source:'Profile settings', title:'User Profile', description:'Your long-term Peak preferences', surface:'Profile settings', location:'Peak folder in your Vault', creation:'You wrote it or accepted a Profile proposal.', reason:'This is the one personal control document kept beside your Peak results.' }
    ];
    const typeOptions=['All','Profile','AI result','Chat save','AI file','Media']; const sourceOptions=['All','Profile settings','AI Search','AI Graph','Vault Intelligence','Chat','Composer']; const timeOptions=['Any time','Today','Last 7 days','Earlier'];
    let activeItem = items[0], activeType='All', activeSource='All', activeTime='Any time', filtersOpen=false;
    const rows=document.getElementById('rows'), detail=document.getElementById('detail'), search=document.getElementById('searchInput'), typeFilters=document.getElementById('typeFilters'), sourceFilters=document.getElementById('sourceFilters'), timeFilters=document.getElementById('timeFilters'), fromDate=document.getElementById('fromDate'), toDate=document.getElementById('toDate'), filterPanel=document.getElementById('filterPanel'), filterSummary=document.getElementById('filterSummary'), filterTrigger=document.querySelector('[data-toggle-filters]');
    function shownItems() { const query=search.value.trim().toLowerCase(); const from=fromDate.value; const to=toDate.value; return items.filter(item => (activeType==='All'||item.type===activeType) && (activeSource==='All'||item.source===activeSource) && (activeTime==='Any time'||item.timeBand===activeTime) && (!from||item.date>=from) && (!to||item.date<=to) && (!query||[item.title,item.description,item.source,item.type,item.id,item.location].join(' ').toLowerCase().includes(query))); }
    function renderFilters() { typeFilters.innerHTML=typeOptions.map(option=>`<button class="chip ${activeType===option?'active':''}" data-filter-type="${option}">${option==='All'?'All types':option}</button>`).join(''); sourceFilters.innerHTML=sourceOptions.map(option=>`<button class="chip ${activeSource===option?'active':''}" data-filter-source="${option}">${option==='All'?'All locations':option}</button>`).join(''); timeFilters.innerHTML=timeOptions.map(option=>`<button class="chip ${activeTime===option?'active':''}" data-filter-time="${option}">${option}</button>`).join(''); const activeCount=[activeType!=='All',activeSource!=='All',activeTime!=='Any time',Boolean(fromDate.value),Boolean(toDate.value)].filter(Boolean).length; filterSummary.textContent=activeCount ? `${activeCount}` : ''; filterPanel.hidden=!filtersOpen; filterTrigger.setAttribute('aria-expanded',String(filtersOpen)); }
    function renderRows() { const visible=shownItems(); const groups=['Today','Last 7 days','Earlier']; rows.innerHTML=visible.length ? groups.map(name => { const groupItems=visible.filter(item => item.timeBand===name); return groupItems.length ? `<div class="family">${name}</div>${groupItems.map(item => `<button class="row ${activeItem?.id===item.id?'active':''}" data-item="${item.id}"><span class="row-icon">${item.type==='Profile'?icons.settings:icons.file}</span><span class="row-copy"><span class="row-title">${item.title}</span><span class="row-meta">${item.description} · ${item.createdAt}</span><span class="row-tags"><span class="tag">${item.type}</span><span class="tag">${item.source}</span></span></span></button>`).join('')}` : ''; }).join('') : '<div class="empty">No Peak outputs match these filters.</div>'; }
    function renderDetail() { const item=activeItem; if (!item) { detail.innerHTML='<div class="empty">Choose a Peak output to inspect it.</div>'; return; } const icon=item.type==='Profile'?icons.settings:icons.file; detail.innerHTML=`<div class="detail-head"><div class="breadcrumbs">My Peak Content · ${item.timeBand}</div><div class="detail-title"><h1>${item.title}</h1><span class="pill">${item.type}</span></div><p class="detail-subtitle">${item.description}</p></div><div class="content"><section class="section"><h2>Why this appears here</h2><div class="notice">${icon}<span>${item.reason}</span></div></section><section class="section"><h2>Where it belongs</h2><dl class="facts"><dt>Created or saved</dt><dd>${item.createdAt}</dd><dt>Created in</dt><dd>${item.source}</dd><dt>Open and edit it in</dt><dd>${item.surface}</dd><dt>Saved location</dt><dd>${item.location}</dd><dt>How it is created</dt><dd>${item.creation}</dd></dl><button class="action" data-open>Open in ${item.surface}</button></section></div>`; }
