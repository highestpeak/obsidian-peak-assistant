<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peak · Data &amp; Storage design mock</title>
  <style>
    :root { color-scheme: light; --bg:#f5f5f3; --surface:#fff; --surface-2:#fafaf8; --line:#e3e3df; --text:#282825; --muted:#73736d; --subtle:#989890; --accent:#6557c8; --accent-soft:#f0edff; --green:#317259; --green-soft:#e9f4ed; --blue:#366f9c; --blue-soft:#eaf2f8; --amber:#8a641e; --amber-soft:#fbf1dc; --radius:8px; --font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { color:var(--text); background:var(--bg); font:13px/1.45 var(--font); }
    button,input { color:inherit; font:inherit; } button { cursor:pointer; } svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .app { display:grid; grid-template-rows:40px 56px minmax(0,1fr); width:100vw; height:100vh; background:var(--surface); }
    .tabbar { display:flex; align-items:stretch; padding-left:48px; border-bottom:1px solid #d8d8d4; background:#ececea; }
    .tab { display:flex; align-items:center; gap:8px; min-width:208px; padding:0 14px; border-right:1px solid #d8d8d4; color:var(--muted); text-decoration:none; }
    .tab.active { color:var(--text); background:var(--surface); border-top:2px solid var(--accent); font-weight:650; }
    .topbar { display:flex; align-items:center; gap:12px; padding:0 18px; border-bottom:1px solid var(--line); }
    .topbar strong { font-size:16px; } .topbar span { color:var(--muted); }
    .body { display:grid; grid-template-columns:224px minmax(350px,430px) minmax(520px,1fr); min-height:0; }
    .rail,.list,.detail { min-height:0; overflow:auto; } .rail { padding:14px 10px; background:var(--surface-2); border-right:1px solid var(--line); } .list { border-right:1px solid var(--line); } .detail { background:var(--surface); }
    .rail-title { padding:0 9px 8px; color:var(--subtle); font-size:11px; font-weight:700; letter-spacing:.01em; }
    .nav { display:grid; grid-template-columns:18px minmax(0,1fr) auto; align-items:center; gap:8px; width:100%; min-height:38px; padding:8px 9px; border:0; border-radius:6px; background:transparent; text-align:left; }
    .nav:hover { background:#f0f0ed; } .nav.active { color:var(--accent); background:var(--accent-soft); font-weight:650; } .nav small { color:var(--subtle); font-size:11px; font-weight:600; }
    .rail-separator { height:1px; margin:12px 9px; background:var(--line); }
    .rail-note { margin:8px 9px; color:var(--muted); font-size:11px; line-height:1.55; }
    .list-head { position:sticky; top:0; z-index:2; padding:14px 16px 12px; border-bottom:1px solid var(--line); background:var(--surface); }
    .list-head strong { display:block; font-size:15px; } .list-head span { display:block; margin-top:2px; color:var(--muted); }
    .search { position:relative; display:block; margin-top:11px; } .search svg { position:absolute; top:9px; left:10px; color:var(--subtle); pointer-events:none; }
    .search input { width:100%; height:34px; padding:0 12px 0 34px; border:1px solid var(--line); border-radius:7px; outline:0; background:var(--surface-2); }
    .search input:focus { border-color:#aaa1dc; background:#fff; box-shadow:0 0 0 2px var(--accent-soft); }
    .rows { padding:8px; } .family { padding:10px 8px 5px; color:var(--subtle); font-size:11px; font-weight:700; }
    .row { display:grid; grid-template-columns:32px minmax(0,1fr) auto; align-items:center; gap:10px; width:100%; min-height:59px; padding:9px; border:0; border-radius:7px; background:transparent; text-align:left; }
    .row:hover { background:var(--surface-2); } .row.active { background:var(--accent-soft); }
    .row-icon { display:grid; place-items:center; width:30px; height:30px; border:1px solid var(--line); border-radius:7px; color:var(--muted); background:#fff; }
    .row.active .row-icon { color:var(--accent); border-color:#d5cef7; }
    .row-copy { min-width:0; } .row-title,.row-meta { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .row-title { font-weight:650; } .row-meta { margin-top:2px; color:var(--muted); font-size:12px; }
    .pill { display:inline-flex; align-items:center; min-height:20px; padding:2px 7px; border-radius:99px; color:var(--muted); background:#f0f0ed; font-size:10px; font-weight:700; white-space:nowrap; } .pill.green { color:var(--green); background:var(--green-soft); } .pill.blue { color:var(--blue); background:var(--blue-soft); } .pill.amber { color:var(--amber); background:var(--amber-soft); }
    .detail-head { padding:18px 24px 16px; border-bottom:1px solid var(--line); } .breadcrumbs { color:var(--subtle); font-size:11px; font-weight:600; } .detail-title { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-top:3px; } h1,h2,h3,p { margin:0; } h1 { font-size:21px; letter-spacing:-.02em; } .detail-subtitle { max-width:760px; margin-top:4px; color:var(--muted); font-size:14px; }
    .content { max-width:920px; padding:20px 24px 48px; } .section + .section { margin-top:24px; } h2 { margin-bottom:10px; font-size:14px; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .card { min-height:98px; padding:13px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface-2); } .card strong,.card span { display:block; } .card strong { margin-bottom:5px; } .card span { color:var(--muted); }
    .facts { display:grid; grid-template-columns:190px minmax(0,1fr); margin:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; } .facts dt,.facts dd { min-height:40px; margin:0; padding:10px 12px; border-bottom:1px solid var(--line); } .facts dt { color:var(--muted); background:var(--surface-2); font-weight:600; } .facts dd { background:#fff; } .facts dt:last-of-type,.facts dd:last-of-type { border-bottom:0; }
    .notice { display:flex; align-items:flex-start; gap:9px; padding:11px 12px; border:1px solid #d9d2fa; border-radius:var(--radius); color:#51488f; background:var(--accent-soft); } .notice svg { flex:0 0 auto; margin-top:1px; }
    .plain-list { display:grid; gap:8px; margin:0; padding:0; list-style:none; } .plain-list li { padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface-2); } .plain-list strong,.plain-list span { display:block; } .plain-list span { margin-top:2px; color:var(--muted); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; } .action { min-height:32px; padding:0 11px; border:1px solid #cec9eb; border-radius:7px; color:var(--accent); background:#fff; font-weight:650; } .action:hover { background:var(--accent-soft); } .action.primary { border-color:var(--accent); color:#fff; background:var(--accent); }
    code { font-family:var(--mono); font-size:11px; } .empty { padding:28px 16px; color:var(--muted); text-align:center; } .mock-note { position:fixed; right:14px; bottom:12px; padding:3px 8px; border:1px solid var(--line); border-radius:5px; color:var(--subtle); background:rgba(255,255,255,.94); font:10px var(--mono); }
    @media (max-width:980px) { .body { grid-template-columns:190px 330px minmax(440px,1fr); } .cards { grid-template-columns:1fr; } } @media (max-width:720px) { .body { grid-template-columns:180px minmax(300px,1fr) minmax(430px,1fr); } }
  </style>
</head>
<body>
  <div class="app">
    <div class="tabbar">
      <a class="tab" href="../ai-control-center-2026-07-30/index.html"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 7.3v9.4L12 21l7.5-4.3V7.3z"/><path d="m8 11 2.5 2.5L16 8"/></svg>AI Control Center</a>
      <div class="tab active"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>Data &amp; Storage</div>
    </div>
    <header class="topbar"><strong>Data &amp; Storage</strong><span>Understand the content Peak saves, the information it remembers, and data kept only on this device.</span></header>
    <div class="body"><aside class="rail" id="rail"></aside><section class="list"><div class="list-head"><strong id="listTitle">Overview</strong><span id="listDescription">A plain-language guide to where Peak keeps information.</span><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="searchInput" type="search" placeholder="Search content or system data…"></label></div><div class="rows" id="rows"></div></section><main class="detail" id="detail"></main></div>
  </div>
  <div class="mock-note">Design mock · no product data is changed</div>
  <script src="../ai-control-center-2026-07-30/output-catalog-data.js"></script>
  <script>
    const icons = {
      overview:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>',
      file:'<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h5"/></svg>',
      memory:'<svg viewBox="0 0 24 24"><path d="M8 4h8v3h3v10h-3v3H8v-3H5V7h3z"/><path d="M9 10h6M9 14h4"/></svg>',
      device:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>',
      history:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v6h6M12 7v5l3 2"/></svg>',
      database:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"/></svg>',
      search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>'
    };
    const titleOverrides = {
      'user-profile.markdown':'User Profile','prompt.override':'Prompt overrides','skill.vault-definition':'Vault skills','project.brief':'Project Briefs','analysis.markdown-export':'Saved AI Search analyses','hub.materialized-note':'Materialized Hub notes','ai-graph.markdown-export':'AI Graph exports','media.generated-attachment':'Generated media','document.accepted-writeback':'Accepted document changes','artifact.native-file':'Native file artifacts',
      'chat.conversation-events':'Conversations','chat.project-state':'Project state','run.events':'AI run receipts','chat.artifact-receipt':'Saved artifact receipts','chat.assistant-definition':'Chat Assistant definitions','chat.project-plan-state':'Project plans','resource.summary-snapshot':'Resource summaries','analysis.snapshot':'AI Search analysis state','hub.manifest':'Hub details','hub.events':'Hub changes','ai-graph.artifact':'AI Graph versions','media.job-events':'Media generation jobs','composer.comments':'Composer comments','composer.workspace-events':'Composer workspace state','composer.document-history':'Document history','composer.generation-history':'Copilot generation history',
      'projection.vault':'Vault search database','projection.chat':'Chat database','index.full-text':'Full-text search index','index.embedding':'Semantic search index','projection.hub-graph':'Hub graph index','cache.summary-preview':'Summary preview cache','telemetry.composer':'Composer diagnostics','debug.local-snapshots':'Developer diagnostics','runtime.native-module':'Local runtime component','backup.sqlite':'Local database backups'
    };
    const plainDescriptions = {
      'user-profile.markdown':'Your long-term preferences and instructions for Peak. You can edit this content.','prompt.override':'Your changes to a built-in Prompt. Peak uses them the next time that Prompt runs.','skill.vault-definition':'A reusable Vault skill that you created or installed.','project.brief':'The project information that you intentionally maintain.','analysis.markdown-export':'An analysis you explicitly saved as a Markdown note.','hub.materialized-note':'A Hub that you explicitly turned into an editable Vault note.','ai-graph.markdown-export':'A graph result you explicitly exported as Markdown.','media.generated-attachment':'An image, video, audio, or other media item you asked Peak to create or edit.','document.accepted-writeback':'A change you reviewed and accepted in your own document.','artifact.native-file':'A file such as a Canvas, Excalidraw, DrawIO, HTML, or PDF that you saved.',
      'chat.conversation-events':'Messages and conversation events so Chat can reopen where you left off.','chat.project-state':'The machine-managed status and AI summary for a project; separate from your editable Brief.','run.events':'A receipt of an AI run: what happened, which model was used, and whether it completed.','chat.artifact-receipt':'The link between a Chat conversation and a file that you saved from it.','chat.assistant-definition':'The saved configuration of a Chat Assistant.','chat.project-plan-state':'The current state of a project plan, including completion and deletion markers.','resource.summary-snapshot':'A reusable summary of a source used in Chat context.','analysis.snapshot':'The in-progress or completed analysis state behind AI Search.','hub.manifest':'The current identity, members, and summary of a Hub.','hub.events':'The ordered history of Hub changes and materialization.','ai-graph.artifact':'The current graph and its immutable saved versions.','media.job-events':'The state of a media job, including progress, failure, and completion.','composer.comments':'Comments attached to a Composer document.','composer.workspace-events':'The state needed to restore your Composer workspace.','composer.document-history':'Your document-level history for review and recovery.','composer.generation-history':'Copilot proposals, including cancelled or unaccepted candidates.',
      'projection.vault':'A local database that makes Vault search and graph views fast.','projection.chat':'A local database that makes Chat lists and queries fast.','index.full-text':'A local index for matching words and phrases quickly.','index.embedding':'A local semantic index for finding meaningfully related notes.','projection.hub-graph':'A local index used to draw Hub relationships.','cache.summary-preview':'A temporary local copy that makes summary previews load faster.','telemetry.composer':'Limited local diagnostic information for investigating Composer behaviour.','debug.local-snapshots':'Local developer diagnostics; not part of your knowledge base.','runtime.native-module':'A local component Peak needs to operate on this device.','backup.sqlite':'Limited local backup copies of rebuildable databases.'
    };
    const groups = [
      { id:'overview', icon:'overview', label:'Overview' },
      { id:'content', icon:'file', label:'My content' },
      { id:'memory', icon:'memory', label:'What Peak remembers' },
      { id:'device', icon:'device', label:'This device' },
      { id:'legacy', icon:'history', label:'Older data' }
    ];
    const records = (window.PEAK_OUTPUT_CATALOG ?? []).map(item => ({ ...item, title:titleOverrides[item.id] ?? item.id.replace(/[.-]/g,' '), description:plainDescriptions[item.id] ?? (item.lifecycle === 'migration-source' ? 'An older file format kept read-only so Peak can migrate safely without overwriting it.' : 'A registered data type owned by its original product surface.') }));
    function groupFor(item) { if (item.lifecycle === 'migration-source') return 'legacy'; if (item.outputClass === 'user-artifact') return 'content'; if (item.outputClass === 'durable-record') return 'memory'; return 'device'; }
    function displayLabel(item) { if (item.lifecycle === 'migration-source') return ['Older file','amber']; if (item.outputClass === 'user-artifact') return ['My content','green']; if (item.outputClass === 'durable-record') return ['Peak remembers','blue']; return ['This device','']; }
    const overviewItems = [
      { id:'overview-content', group:'overview', title:'My content', description:'Things you created, accepted, or explicitly saved. These belong to you.', count:records.filter(item=>groupFor(item)==='content').length, icon:'file' },
      { id:'overview-memory', group:'overview', title:'What Peak remembers', description:'System records that let Peak restore conversations, projects, graphs, and reviews.', count:records.filter(item=>groupFor(item)==='memory').length, icon:'memory' },
      { id:'overview-device', group:'overview', title:'This device', description:'Search indexes, caches, and diagnostics used to make Peak run smoothly here.', count:records.filter(item=>groupFor(item)==='device').length, icon:'device' },
      { id:'overview-legacy', group:'overview', title:'Older data', description:'Read-only files left by earlier Peak versions. They are never automatically deleted.', count:records.filter(item=>groupFor(item)==='legacy').length, icon:'history' }
    ];
    let activeGroup = 'overview'; let activeItem = overviewItems[0]; const rail=document.getElementById('rail'), rows=document.getElementById('rows'), detail=document.getElementById('detail'), search=document.getElementById('searchInput'), listTitle=document.getElementById('listTitle'), listDescription=document.getElementById('listDescription');
    function renderRail() { rail.innerHTML = '<div class="rail-title">Data &amp; storage</div>' + groups.map(group => { const count=group.id==='overview' ? '' : records.filter(item=>groupFor(item)===group.id).length; return `<button class="nav ${activeGroup===group.id?'active':''}" data-group="${group.id}">${icons[group.icon]}<span>${group.label}</span><small>${count}</small></button>`; }).join('') + '<div class="rail-separator"></div><div class="rail-note">This page explains data storage. AI behaviour and Prompt configuration live in AI Control Center.</div>'; }
    function visibleItems() { const q=search.value.trim().toLowerCase(); if (q) return records.filter(item=>[item.title,item.description,item.id,item.owner,item.carrier].join(' ').toLowerCase().includes(q)); return activeGroup==='overview'?overviewItems:records.filter(item=>groupFor(item)===activeGroup); }
    function rowIcon(item) { return icons[item.icon] ?? (groupFor(item)==='content'?icons.file:groupFor(item)==='memory'?icons.memory:groupFor(item)==='device'?icons.device:icons.history); }
    function renderRows() { const items=visibleItems(); const group=groups.find(candidate=>candidate.id===activeGroup); listTitle.textContent=search.value.trim()? 'Search results' : group.label; listDescription.textContent=search.value.trim()? `${items.length} matching data types` : activeGroup==='overview' ? 'Start with the kind of information you want to understand.' : group.id==='content' ? 'Content you created, accepted, or intentionally saved.' : group.id==='memory' ? 'System records that restore work; they are not documents to edit.' : group.id==='device' ? 'Local data used for performance and diagnostics.' : 'Older formats kept safely read-only.'; rows.innerHTML=items.length?items.map(item=>{ const label=item.group==='overview'?`${item.count} types`:displayLabel(item)[0]; const color=item.group==='overview'?'':displayLabel(item)[1]; return `<button class="row ${activeItem?.id===item.id?'active':''}" data-item="${item.id}"><span class="row-icon">${rowIcon(item)}</span><span class="row-copy"><span class="row-title">${item.title}</span><span class="row-meta">${item.description}</span></span><span class="pill ${color}">${label}</span></button>`; }).join(''):'<div class="empty">No content or system data matches this search.</div>'; }
    function storagePlace(item) { if (item.path.scope==='user-selected') return 'The location you selected'; if (item.path.scope==='ai-root') return 'Peak folder in your Vault'; if (item.path.scope==='vault-root') return 'Older file in your Vault'; if (item.path.scope==='plugin-data') return 'Peak plugin data on this device'; return 'Peak DataStore'; }
    function dataDetails(item) { const label=displayLabel(item); const canOpen=item.outputClass==='user-artifact'; const canMaintain=item.id==='projection.vault'||item.id==='index.full-text'||item.id==='index.embedding'||item.id==='cache.summary-preview'; const actions=canOpen ? '<button class="action primary" data-demo-action>Open in its original surface</button>' : canMaintain ? `<button class="action primary" data-demo-action>${item.outputClass==='cache'?'Clear local cache':'Rebuild local index'}</button>` : ''; return `<div class="detail-head"><div class="breadcrumbs">Data &amp; Storage · ${label[0]}</div><div class="detail-title"><h1>${item.title}</h1><span class="pill ${label[1]}">${label[0]}</span></div><p class="detail-subtitle">${item.description}</p></div><div class="content"><section class="section"><h2>What this means for you</h2><div class="notice">${rowIcon(item)}<span>${canOpen?'This is your content. Peak keeps it in the product surface where you created or accepted it.':item.outputClass==='durable-record'?'Peak keeps this so your work can be restored and remain consistent across devices. You use the result in its original product surface, not by editing this record.':item.lifecycle==='migration-source'?'This is an older file from a previous format. Peak may read it safely during migration, but it will not overwrite, move, or delete it automatically.':'This exists only on this device to help Peak search, load, or diagnose issues. It is not a document and is not part of your Vault knowledge.'}</span></div></section><section class="section"><h2>Where Peak keeps it</h2><dl class="facts"><dt>Stored in</dt><dd>${storagePlace(item)}</dd><dt>File format</dt><dd>${item.carrier.toUpperCase()}</dd><dt>Syncs with your data</dt><dd>${item.syncPolicy==='required'?'Yes':'No — local to this device'}</dd><dt>Can you edit it here?</dt><dd>${canOpen?'Open the owning surface to edit it':'No — use the owning feature, or the safe maintenance action when one is available'}</dd></dl><div class="actions">${actions}</div></section>${item.outputClass==='durable-record'?'<section class="section"><h2>Where you see its effect</h2><ul class="plain-list"><li><strong>In the original feature</strong><span>For example, conversations appear in Chat; graph versions appear in AI Graph; review proposals appear in Composer.</span></li><li><strong>Not as a second document</strong><span>Peak deliberately does not create a duplicate Markdown file for each machine record.</span></li></ul></section>':''}</div>`; }
    function overviewDetails(item) { const detailCopy={ 'overview-content':['My content','These are the only stored things that behave like your files: you created them, accepted them, or explicitly saved them. They stay in the feature where they belong.'], 'overview-memory':['What Peak remembers','These are system records, not extra notes. They allow Chat, AI Search, AI Graph, Hubs, and Composer to reopen and remain consistent.'], 'overview-device':['This device','These are local search indexes, caches, backups, and diagnostics. They are not synced knowledge and can be rebuilt or cleared when a maintenance control is provided.'], 'overview-legacy':['Older data','These are files created by older Peak versions. They stay read-only and are never moved, overwritten, or deleted automatically.'] }; const [title,subtitle]=detailCopy[item.id]; return `<div class="detail-head"><div class="breadcrumbs">Data &amp; Storage</div><div class="detail-title"><h1>${title}</h1><span class="pill">${item.count} types</span></div><p class="detail-subtitle">${subtitle}</p></div><div class="content"><section class="section"><h2>Why this page exists</h2><div class="cards"><div class="card"><strong>Transparency</strong><span>You can see what Peak stores without treating internal files as ordinary documents.</span></div><div class="card"><strong>Clear ownership</strong><span>Your content stays in its original feature. System data stays owned by the system that needs it.</span></div></div></section><section class="section"><h2>What you can do here</h2><ul class="plain-list"><li><strong>Open your saved content</strong><span>Profile, Prompt overrides, Skills, exports, generated media, Hub notes, and accepted document changes remain reachable from their original surface.</span></li><li><strong>Understand Peak memory</strong><span>Read why Peak keeps a record without being asked to edit JSON or manage run logs.</span></li><li><strong>Maintain this device</strong><span>Use explicit rebuild or clear actions only for local indexes and caches.</span></li></ul></section></div>`; }
    function renderDetail() { detail.innerHTML=activeItem.group==='overview'?overviewDetails(activeItem):dataDetails(activeItem); }
    function renderAll() { renderRail(); renderRows(); renderDetail(); }
    document.addEventListener('click', event=>{ const groupButton=event.target.closest('[data-group]'); if(groupButton){ activeGroup=groupButton.dataset.group; activeItem=activeGroup==='overview'?overviewItems[0]:records.find(item=>groupFor(item)===activeGroup); search.value=''; renderAll(); return; } const itemButton=event.target.closest('[data-item]'); if(itemButton){ activeItem=[...overviewItems,...records].find(item=>item.id===itemButton.dataset.item); renderRows(); renderDetail(); return; } const action=event.target.closest('[data-demo-action]'); if(action){ action.textContent='Saved in this mock'; action.disabled=true; }});
    search.addEventListener('input',()=>{ const visible=visibleItems(); if(visible.length && !visible.some(item=>item.id===activeItem?.id)) activeItem=visible[0]; renderRows(); renderDetail(); }); renderAll();
  </script>
</body>
