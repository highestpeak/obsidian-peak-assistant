<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peak · AI Control Center design mock</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f3;
      --surface: #ffffff;
      --surface-2: #fafaf8;
      --surface-3: #f1f1ee;
      --line: #e3e3df;
      --line-strong: #d2d2cc;
      --text: #282825;
      --muted: #73736d;
      --subtle: #989890;
      --accent: #6557c8;
      --accent-soft: #f0edff;
      --green: #317259;
      --green-soft: #e9f4ed;
      --amber: #8a641e;
      --amber-soft: #fbf1dc;
      --red: #9b4545;
      --red-soft: #faebeb;
      --blue: #366f9c;
      --blue-soft: #eaf2f8;
      --radius: 8px;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--text); background: var(--bg); font: 13px/1.45 var(--font); }
    button, input { color: inherit; font: inherit; }
    button { cursor: pointer; }
    svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .hidden { display: none !important; }

    .app {
      display: grid;
      grid-template-rows: 40px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      background: var(--surface);
    }

    .tabbar {
      display: flex;
      align-items: stretch;
      padding-left: 48px;
      border-bottom: 1px solid #d8d8d4;
      background: #ececea;
    }

    .obsidian-tab, .obsidian-tab-link {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
      padding: 0 14px;
      background: var(--surface);
      border-top: 2px solid var(--accent);
      border-right: 1px solid #d8d8d4;
      font-weight: 620;
    }

    .obsidian-tab-link { color: var(--muted); text-decoration: none; }
    .obsidian-tab-link:hover { color: var(--text); background: #f5f5f3; }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 56px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .title {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 10px;
    }

    .title strong { font-size: 16px; white-space: nowrap; }
    .title span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .search {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search svg { position: absolute; left: 10px; color: var(--subtle); pointer-events: none; }
    .search input {
      width: 100%;
      height: 34px;
      padding: 0 12px 0 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: 0;
      background: var(--surface-2);
    }

    .search input:focus {
      border-color: #aaa1dc;
      background: white;
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .shell {
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
      min-height: 0;
    }

    .body {
      display: grid;
      grid-template-columns: 224px minmax(330px, 430px) minmax(520px, 1fr);
      min-height: 0;
    }

    .rail, .list, .inspector { min-height: 0; overflow: auto; }
    .rail { padding: 14px 10px; border-right: 1px solid var(--line); background: var(--surface-2); }
    .list { border-right: 1px solid var(--line); background: var(--surface); }
    .inspector { background: var(--surface); }

    .rail-title {
      padding: 0 9px 8px;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 700;
    }

    .rail-button {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 36px;
      padding: 7px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      text-align: left;
    }

    .rail-button:hover { background: var(--surface-3); }
    .rail-button.active { color: var(--accent); background: var(--accent-soft); }
    .rail-button small { color: var(--subtle); }
    .rail-separator { height: 1px; margin: 12px 8px; background: var(--line); }

    .list-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 15px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .list-head strong { display: block; font-size: 14px; }
    .list-head span { display: block; margin-top: 3px; color: var(--muted); }
    .list-head .search { margin-top: 10px; }

    .rows { padding: 6px; }
    .family-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 10px 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .01em;
    }
    .family-head:first-child { padding-top: 7px; }
    .family-head small { color: var(--subtle); font-weight: 650; }
    .row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 10px;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      text-align: left;
    }

    .row:hover { background: var(--surface-2); }
    .row.active { background: var(--accent-soft); }
    .row-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: var(--muted);
    }

    .row.active .row-icon { color: var(--accent); border-color: #cfc8f1; }
    .row-copy { min-width: 0; }
    .row-title { display: block; overflow: hidden; font-weight: 650; white-space: nowrap; text-overflow: ellipsis; }
    .row-meta { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); white-space: nowrap; text-overflow: ellipsis; }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.green { color: var(--green); background: var(--green-soft); }
    .pill.amber { color: var(--amber); background: var(--amber-soft); }
    .pill.red { color: var(--red); background: var(--red-soft); }
    .pill.blue { color: var(--blue); background: var(--blue-soft); }
    .pill.purple { color: var(--accent); background: var(--accent-soft); }

    .inspector-head {
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 18px 22px 0;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
    }

    .breadcrumbs { color: var(--muted); font-size: 11px; }
    .inspector-title-row { display: flex; align-items: flex-start; gap: 12px; margin-top: 7px; }
    .inspector-title-row h1 { flex: 1; margin: 0; font-size: 21px; line-height: 1.25; }
    .inspector-subtitle { max-width: 820px; margin: 7px 0 14px; color: var(--muted); font-size: 13px; }
    .panel { display: none; padding: 20px 22px 80px; }
    .panel.active { display: block; }

    .section { margin-bottom: 24px; }
    .section h2 { margin: 0 0 10px; font-size: 14px; }
    .section p { margin: 0; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card { padding: 13px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
    .card strong { display: block; margin-bottom: 4px; }
    .card span { color: var(--muted); }

    .facts {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      margin: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .facts dt, .facts dd { margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .facts dt { color: var(--muted); background: var(--surface-2); }
    .facts dd { min-width: 0; }
    .facts dt:last-of-type, .facts dd:last-of-type { border-bottom: 0; }
    code { font-family: var(--mono); font-size: 11px; }

    .notice {
      display: flex;
      gap: 10px;
      padding: 12px;
      border: 1px solid #dcd6f5;
      border-radius: var(--radius);
      color: #514797;
      background: var(--accent-soft);
    }

    .notice svg { flex: 0 0 auto; margin-top: 1px; }
    .notice.amber { color: var(--amber); border-color: #ead7ae; background: var(--amber-soft); }
    .flow { display: grid; gap: 10px; }
    .flow-stage {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .flow-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px;
      border-right: 1px solid var(--line);
      background: var(--surface-2);
      font-weight: 700;
    }

    .steps { display: grid; gap: 0; }
    .step {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 9px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .step:last-child { border-bottom: 0; }
    .step-num { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--muted); background: var(--surface-3); font-size: 10px; font-weight: 700; }
    .step strong { display: block; }
    .step span { display: block; margin-top: 2px; color: var(--muted); }

    .prompt-box {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .prompt-box + .prompt-box { margin-top: 9px; }
    .prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .prompt-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .prompt-body { margin-top: 9px; padding: 11px; border: 1px solid var(--line); border-radius: 6px; background: white; color: #50504b; font: 11px/1.55 var(--mono); white-space: pre-wrap; }
    .template-preview { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .template-preview > span { color: var(--muted); font-family: inherit; }
    .template-token, .variable-code { padding: 2px 5px; border-radius: 4px; background: #f4f2fb; color: #5d53a7; font: 10px/1.45 var(--mono); }
    .variable-summary { margin-top: 9px; }
    .variable-summary-copy { min-width: 0; }
    .variable-summary-copy strong { display: block; font-size: 12px; }
    .variable-summary-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .variable-inline-list, .variable-editor-list { display: grid; grid-template-columns: 1fr; margin-top: 9px; }
    .variable-inline-item, .variable-editor-item { display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); gap: 12px; align-items: start; min-width: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .variable-inline-item:last-child, .variable-editor-item:last-child { border-bottom: 0; }
    .variable-inline-item code, .variable-editor-item code { flex: 0 0 auto; color: #5d53a7; font: 10px/1.4 var(--mono); }
    .variable-inline-item span, .variable-editor-item span { overflow: hidden; color: var(--muted); font-size: 11px; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
    .variable-disclosure-toggle { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
    .variable-extra { display: none; }
    .variable-disclosure-toggle:checked + .variable-inline-list .variable-extra,
    .variable-disclosure-toggle:checked + .variable-editor-list .variable-extra { display: grid; }
    .variable-disclosure-label { display: inline-block; margin-top: 8px; color: var(--accent); cursor: pointer; font-size: 11px; font-weight: 650; }
    .variable-disclosure-label .less { display: none; }
    .variable-disclosure-toggle:checked + .variable-inline-list + .variable-disclosure-label .more,
    .variable-disclosure-toggle:checked + .variable-editor-list + .variable-disclosure-label .more { display: none; }
    .variable-disclosure-toggle:checked + .variable-inline-list + .variable-disclosure-label .less,
    .variable-disclosure-toggle:checked + .variable-editor-list + .variable-disclosure-label .less { display: inline; }
    .variable-inline-item span, .variable-editor-item span { overflow: visible; text-overflow: clip; white-space: normal; }
    .variable-editor-note { margin: 0 0 12px; color: var(--muted); }
    .variable-editor-list { margin-top: 0; padding: 12px; border: 1px solid #ded9f3; border-radius: 6px; background: #fbfaff; }
    .variable-editor-item { min-height: 28px; }

    .prompt-editor {
      width: 100%;
      min-height: 210px;
      margin-top: 10px;
      padding: 12px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      outline: 0;
      background: white;
      color: #50504b;
      font: 11px/1.6 var(--mono);
    }

    .prompt-editor:focus { border-color: #aaa1dc; box-shadow: 0 0 0 2px var(--accent-soft); }
    .prompt-editor.compact { min-height: 112px; }
    .prompt-editor:disabled { color: var(--muted); background: var(--surface-3); }

    .button-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .action-button {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: white;
      font-weight: 620;
    }

    .action-button.primary { color: white; border-color: var(--accent); background: var(--accent); }
    .action-button:disabled { cursor: not-allowed; opacity: .5; }

    .route {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-top: 9px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .route.active { border-color: #cfc8f1; background: var(--accent-soft); }
    .route input { accent-color: var(--accent); }
    .route strong, .route span { display: block; }
    .route span { color: var(--muted); }
    .route-effective { text-align: right; }
    .route-effective code { display: block; color: var(--text); margin-top: 3px; }

    .link-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-weight: 620;
    }

    .output-actions { display: grid; gap: 8px; }
    .output-action {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
      text-align: left;
    }
    .output-action:hover { border-color: #cfc8f1; background: var(--accent-soft); }
    .output-action strong, .output-action span { display: block; }
    .output-action span { margin-top: 2px; color: var(--muted); }
    .output-action > small { color: var(--accent); font-weight: 650; white-space: nowrap; }
    .source-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .source-list li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); overflow-wrap: anywhere; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(28, 28, 25, .34);
    }

    .modal {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(620px, calc(100vw - 48px));
      max-height: min(720px, calc(100vh - 48px));
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(28, 28, 25, .24);
    }
    .modal.wide { width: min(900px, calc(100vw - 48px)); max-height: min(840px, calc(100vh - 48px)); }

    .modal-head, .modal-footer { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
    .modal-head { border-bottom: 1px solid var(--line); }
    .modal-head-copy { flex: 1; min-width: 0; }
    .modal-head strong { display: block; font-size: 15px; }
    .modal-head span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .modal-close { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; }
    .modal-body { min-height: 0; overflow: auto; padding: 16px; }
    .modal-footer { justify-content: flex-end; border-top: 1px solid var(--line); background: var(--surface-2); }
    .modal-copy { margin-bottom: 14px; color: var(--muted); }
    .field { display: grid; gap: 6px; margin-top: 12px; }
    .field:first-child { margin-top: 0; }
    .field > span { font-weight: 650; }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 34px;
      padding: 8px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      outline: 0;
      background: white;
      color: var(--text);
      font: inherit;
    }
    .field textarea { min-height: 180px; resize: vertical; font-family: var(--mono); font-size: 11px; line-height: 1.55; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #aaa1dc; box-shadow: 0 0 0 2px var(--accent-soft); }
    .inline-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
    .inline-controls .field { margin: 0; }
    .inline-controls .field.wide { grid-column: 1 / -1; }
    .inline-save-status { margin-right: auto; color: var(--green); font-size: 11px; font-weight: 650; }
    .stepper { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 34px; align-items: center; min-height: 34px; overflow: hidden; border: 1px solid var(--line-strong); border-radius: 6px; background: white; }
    .stepper:focus-within { border-color: #aaa1dc; box-shadow: 0 0 0 2px var(--accent-soft); }
    .stepper input { min-width: 0; min-height: 32px; padding: 6px 8px; border: 0; border-radius: 0; outline: 0; box-shadow: none; background: transparent; }
    .stepper input:focus { box-shadow: none; }
    .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { margin: 0; appearance: none; }
    .stepper-unit { padding: 0 7px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .stepper-button { display: grid; place-items: center; align-self: stretch; padding: 0; border: 0; background: var(--surface-2); color: var(--muted); }
    .stepper-button:first-child { border-right: 1px solid var(--line); }
    .stepper-button:last-child { border-left: 1px solid var(--line); }
    .stepper-button:hover { color: var(--accent); background: var(--accent-soft); }
    .stepper-button svg { width: 14px; height: 14px; }

    .empty { padding: 30px 18px; color: var(--muted); text-align: center; }
    .design-note {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 20;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--subtle);
      background: rgba(255,255,255,.92);
      font: 10px var(--mono);
    }

    @media (max-width: 1120px) {
      .body { grid-template-columns: 190px 340px minmax(460px, 1fr); }
      .cards { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .variable-inline-item, .variable-editor-item { grid-template-columns: 1fr; gap: 3px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="tabbar">
      <div class="obsidian-tab">
        <svg viewBox="0 0 24 24"><path d="M12 3 4.5 7.3v9.4L12 21l7.5-4.3V7.3z"/><path d="m8 11 2.5 2.5L16 8"/></svg>
        <span>AI Control Center</span>
      </div>
      <a class="obsidian-tab-link" href="../data-storage-2026-08-04/index.html">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
        <span>Data &amp; Storage</span>
      </a>
    </div>

    <div class="shell">
      <header class="topbar">
        <div class="title">
          <strong>AI Control Center</strong>
          <span>Manage AI actions and shared prompts</span>
        </div>
      </header>

      <div class="body">
        <aside class="rail" id="rail"></aside>
        <section class="list">
          <div class="list-head">
            <strong id="listTitle">All AI actions</strong>
            <span id="listDescription">Choose an action to review its behavior and configuration.</span>
            <label class="search">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
              <input id="searchInput" type="search" placeholder="Search AI actions or prompts…">
            </label>
          </div>
          <div class="rows" id="rows"></div>
        </section>
        <main class="inspector" id="inspector"></main>
      </div>
    </div>
  </div>

  <div class="design-note">Design mock · no product settings are changed</div>

  <div class="modal-backdrop hidden" id="editorModal" role="dialog" aria-modal="true" aria-labelledby="editorModalTitle">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-head-copy"><strong id="editorModalTitle">Edit configuration</strong><span id="editorModalSubtitle">Changes apply to the current AI action.</span></div>
        <button class="action-button modal-close" id="editorModalClose" aria-label="Close editor"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

    const deterministicActionIds = new Set([

      'copilot.smart-connections', 'copilot.suggest-semantic-links', 'ambient.morning-briefing'

    const delegatedActionIds = new Set([
      'composer.copilot.session', 'chat.artifact.document', 'chat.artifact.dataview',
      'chat.artifact.excalidraw', 'chat.artifact.drawio', 'chat.artifact.extract', 'chat.artifact.reminder'
    ]);

    function getExecutionKind(item) {
      if (item.group === 'user' || item.id === 'copilot.custom-prompt') return 'user';
      if (deterministicActionIds.has(item.id)) return 'deterministic';
      if (delegatedActionIds.has(item.id)) return 'delegated';
      if (item.id.includes('embedding')) return 'embedding';
      if (item.id.includes('rerank')) return 'rerank';
      if (item.id === 'composer.image.edit' || (item.id.startsWith('media.') && !item.id.endsWith('.understand'))) return 'media';
      if (/agent|tool loop|workflow|harness/i.test(item.shape)) return 'agent';
      return 'text';
    }

    for (const capability of capabilities) {
      capability.actionInstruction = actionInstructionDefaults[capability.id] ?? '';
      capability.executionKind = getExecutionKind(capability);
    }

    const promptGroupLabels = {
      chat: 'Chat', searchAnalysis: 'Search & Analysis', indexing: 'Knowledge Index',
      copilot: 'Copilot / Composer', userProfile: 'User Profile', ambientContext: 'Ambient / Context'
    };
    const prompts = String(window.PEAK_PROMPT_CATALOG_TEXT ?? '')
      .trim()
      .split('\n')
      .filter(Boolean)
      .map(line => {
        const [id, stem, title, description, group, system, sourceStatus, variables, callers] = line.split('|');
        const status = sourceStatus === '引用' ? 'live' : sourceStatus === '配套' ? 'support' : sourceStatus === '需迁移' ? 'migration' : 'unwired';
        return {
          id,
          stem,
          title,
          description,
          group: promptGroupLabels[group] ?? group,
          system,
          variables,
          callers,
          kind: system ? 'Executable prompt' : id.includes('system') ? 'System prompt' : 'Registered prompt',
          owners: 0,
          version: sourceStatus === '需迁移' ? 'Runtime source; registration required' : 'Built-in default; optional Vault override',
          customized: false,
          status
        };
      });

    for (const prompt of prompts) {
      const pairedPromptIds = prompts.filter(candidate => candidate.system === prompt.id).map(candidate => candidate.id);
      const ownedIds = new Set([prompt.id, ...pairedPromptIds]);
      prompt.owners = capabilities.filter(item => item.prompts.some(id => ownedIds.has(id))).length;
    }

    for (const capability of capabilities) {
      for (const promptId of capability.prompts) {
        if (prompts.some(prompt => prompt.id === promptId)) continue;
        prompts.push({
          id: promptId,
          title: promptId.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '),
          group: capability.surface,
          kind: 'Capability prompt',
          owners: capabilities.filter(item => item.prompts.includes(promptId)).length,
          version: 'Missing from Prompt Catalog',
          customized: false,
          status: capability.status
        });
      }
    }

    let activeGroup = 'all';
    let activeItem = capabilities[0];

    const rows = document.getElementById('rows');
    const inspector = document.getElementById('inspector');

    const listTitle = document.getElementById('listTitle');
    const listDescription = document.getElementById('listDescription');

    const editorModalTitle = document.getElementById('editorModalTitle');
    const editorModalSubtitle = document.getElementById('editorModalSubtitle');
    const editorModalBody = document.getElementById('editorModalBody');

    const groups = [

    function statusPill(status) {
      if (status === 'live') return '<span class="pill green">Source wired</span>';
      if (status === 'partial') return '<span class="pill amber">Partial path</span>';
      if (status === 'support') return '<span class="pill blue">Background</span>';
      if (status === 'migration') return '<span class="pill amber">Runtime migration</span>';
      if (status === 'unwired') return '<span class="pill red">Catalog only</span>';
      return `<span class="pill">${status}</span>`;
    }

    function promptPill(item) {
      if (item.customized) return '<span class="pill purple">Customized</span>';
      if (item.status === 'migration') return '<span class="pill amber">Runtime migration</span>';
      if (item.owners === 0 && item.status === 'unwired') return '<span class="pill red">Catalog only</span>';
      if (item.owners === 0) return '<span class="pill blue">Source helper</span>';
      return '<span class="pill">Default</span>';
    }

    function renderRail() {
      rail.innerHTML = `<div class="rail-title">AI actions</div>` +
        groups.map(([id, icon, label]) => {
          const count = id === 'all' ? capabilities.length : capabilities.filter(item => item.group === id).length;
          const active = workspace === 'capabilities' && activeGroup === id;
          return `<button class="rail-button ${active ? 'active' : ''}" data-group="${id}">${icons[icon]}<span>${label}</span><small>${count}</small></button>`;
        }).join('') +
        `<div class="rail-separator"></div>
         <div class="rail-title">Prompt library</div>
         <button class="rail-button ${workspace === 'prompts' ? 'active' : ''}" data-catalog="prompts">${icons.prompt}<span>All prompts</span><small>${prompts.length}</small></button>`;
    }

    function capabilityRow(item) {
      return `<button class="row ${activeItem?.id === item.id ? 'active' : ''}" data-id="${item.id}">
        <span class="row-icon">${icons[item.icon]}</span>
        <span class="row-copy">
          <span class="row-title">${item.title}</span>
          <span class="row-meta">${item.shape} · ${item.route}</span>
        </span>
        ${statusPill(item.status)}
      </button>`;
    }

    function groupedCapabilityRows(items) {
      // The left rail already expresses product ownership. Within each family,
      // keep the original action order inside a coverage state, but keep the
      // same status pill together so gaps are scannable at a glance.
      const statusOrder = { live: 0, partial: 1, support: 2, migration: 3, unwired: 4 };
      const sections = [];
      for (const item of items) {
        const key = `${item.group}:${item.family}`;
        let section = sections.find(candidate => candidate.key === key);
        if (!section) {
          section = { key, group: item.group, family: item.family, items: [] };
          sections.push(section);
        }
        section.items.push(item);
      }
      return sections.map(section => {
        const groupLabel = groups.find(group => group[0] === section.group)?.[2] ?? section.group;
        const label = activeGroup === 'all' ? `${groupLabel} · ${section.family}` : section.family;
        const orderedItems = section.items
          .map((item, index) => ({ item, index }))
          .sort((a, b) => (statusOrder[a.item.status] ?? 99) - (statusOrder[b.item.status] ?? 99) || a.index - b.index)
          .map(({ item }) => item);
        return `<div class="family-head"><span>${label}</span><small>${section.items.length}</small></div>${orderedItems.map(capabilityRow).join('')}`;
      }).join('');
    }

    function promptRow(item) {
      return `<button class="row ${activeItem?.id === item.id ? 'active' : ''}" data-prompt-id="${item.id}">
        <span class="row-icon">${icons.prompt}</span>
        <span class="row-copy">
          <span class="row-title">${item.title}</span>
          <span class="row-meta">${item.group} · Used by ${item.owners} AI action${item.owners === 1 ? '' : 's'}</span>
        </span>
        ${promptPill(item)}
      </button>`;
    }

    function renderRows() {
      const query = searchInput.value.trim().toLowerCase();
      listDescription.classList.remove('hidden');
      if (query) {
        const matchedCapabilities = capabilities.filter(item => [item.id, item.title, item.surface, item.shape, item.route].join(' ').toLowerCase().includes(query));
        const matchedPrompts = prompts.filter(item => [item.id, item.title, item.group, item.kind, item.callers].join(' ').toLowerCase().includes(query));
        listTitle.textContent = 'Search results';
        listDescription.textContent = `${matchedCapabilities.length} AI actions · ${matchedPrompts.length} prompts`;
        const capabilityResults = matchedCapabilities.length
          ? `<div class="family-head"><span>AI actions</span><small>${matchedCapabilities.length}</small></div>${matchedCapabilities.map(capabilityRow).join('')}`
          : '';
        const promptResults = matchedPrompts.length
          ? `<div class="family-head"><span>Prompts</span><small>${matchedPrompts.length}</small></div>${matchedPrompts.map(promptRow).join('')}`
          : '';
        rows.innerHTML = capabilityResults + promptResults || '<div class="empty">No AI action or prompt matches this search.</div>';
        return;
      }
      if (workspace === 'capabilities') {
        listTitle.textContent = activeGroup === 'all' ? 'All AI actions' : groups.find(item => item[0] === activeGroup)?.[2] ?? 'AI actions';
        listDescription.textContent = '';
        listDescription.classList.add('hidden');
        const filtered = capabilities.filter(item => {
          const groupMatch = activeGroup === 'all' || item.group === activeGroup;
          return groupMatch && [item.id, item.title, item.surface, item.shape, item.route].join(' ').toLowerCase().includes(query);
        });
        rows.innerHTML = filtered.length ? groupedCapabilityRows(filtered) : '<div class="empty">No AI action matches this filter.</div>';
        return;
      }

      if (workspace === 'prompts') {
        listTitle.textContent = 'All prompts';
        listDescription.textContent = '';
        listDescription.classList.add('hidden');
        const filtered = prompts.filter(item => [item.id, item.title, item.group, item.kind].join(' ').toLowerCase().includes(query));
        rows.innerHTML = filtered.length ? filtered.map(promptRow).join('') : '<div class="empty">No prompt matches this search.</div>';
        return;
      }

    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

    const templateVariableDefinitions = {

      activeFilePath: { label: 'Active note path', source: 'Current workspace context', availability: 'Optional', explanation: 'The path of the note currently open in Obsidian. It is only a contextual hint and can be absent when search was opened without a note.', example: '"Projects/Planning.md"' },
      currentResultView: { label: 'Current result view', source: 'Vault Search state', availability: 'Optional', explanation: 'The results tab the person is looking at, such as files or content. It describes their browsing state, not source evidence.', example: '"files"' },
      recentQueriesLine: { label: 'Recent searches', source: 'Vault Search history', availability: 'Optional', explanation: 'A compact list of the person’s recent searches in this session. It helps avoid suggesting wording they already tried.', example: '"research, planning"' },
      recentOpenedFilesLine: { label: 'Recently opened notes', source: 'Workspace history', availability: 'Optional', explanation: 'Recently opened Vault notes. Use only as a weak context clue; these notes are not automatically evidence for the answer.', example: '"Projects/Planning.md"' },
      pinnedLine: { label: 'Pinned context', source: 'Vault Search state', availability: 'Optional', explanation: 'Notes or results the person explicitly pinned while searching. This is the strongest optional signal of what they want to keep in view.', example: '"Pinned: Roadmap"' },
      knownTopFoldersLine: { label: 'Known top folders', source: 'Vault structure', availability: 'Optional', explanation: 'A short summary of top-level Vault folders. It keeps folder-oriented suggestions grounded in folders that actually exist.', example: '"Projects, Notes"' },
      typedTrail: { label: 'Typed query trail', source: 'Vault Search interaction', availability: 'Optional', explanation: 'How the query changed while the person typed. It reveals abandoned terms so the suggestion does not simply repeat them.', example: '"pro → project"' },
      firstScreenLine: { label: 'First visible results', source: 'Vault Search result view', availability: 'Optional', explanation: 'A compact description of the first results already visible. It helps judge whether the current query is too broad or too narrow.', example: '"3 matching notes"' },
      eventCount: { label: 'Interaction count', source: 'Vault Search interaction', availability: 'Optional', explanation: 'The number of relevant search interactions in this session. It gives only session depth, never document content.', example: '3' },
      sessionTimeline: { label: 'Search session timeline', source: 'Vault Search interaction', availability: 'Optional', explanation: 'An ordered summary of query edits, opens, and pins during this search. It captures intent progression without becoming a chat transcript.', example: '"typed → opened → pinned"' },
      title: { label: 'Document title', source: 'Current document', availability: 'Required', explanation: 'The title of the document or block owner being processed. Use it to preserve the subject and to name output clearly.', example: '"Project plan"' },
      content: { label: 'Source content', source: 'Frozen action input', availability: 'Required', explanation: 'The exact frozen source text the action is allowed to transform or analyse. It is captured before the run so edits cannot drift mid-generation.', example: '"Selected source text…"' },
      selection: { label: 'Selected text', source: 'Current editor selection', availability: 'Optional', explanation: 'The text the person explicitly selected. When it is absent, the action falls back to its documented document or block scope.', example: '"The selected paragraph…"' },
      instruction: { label: 'Requested action', source: 'Action menu or user input', availability: 'Required', explanation: 'The instruction chosen in the action menu or typed by the person. It states the requested transformation while the source stays in its own field.', example: '"Make this clearer"' },
      before: { label: 'Leading context', source: 'Composer block projection', availability: 'Optional', explanation: 'Text immediately before the target block. It helps preserve transitions but is not part of the requested replacement.', example: '"Previous block…"' },
      after: { label: 'Trailing context', source: 'Composer block projection', availability: 'Optional', explanation: 'Text immediately after the target block. It helps maintain continuity without authorizing a change outside the target.', example: '"Next block…"' },
      blockKind: { label: 'Current block type', source: 'Composer block projection', availability: 'Required', example: '"paragraph"' },
      table: { label: 'Table source', source: 'Composer table projection', availability: 'Required', example: '"| Name | Status |"' },
      language: { label: 'Code language', source: 'Native block metadata', availability: 'Optional', example: '"typescript"' },
      searchQuery: { label: 'Graph search request', source: 'AI Graph input', availability: 'Required', example: '"Show related concepts"' },
      sources: { label: 'Selected sources', source: 'AI Graph source set', availability: 'Required', example: '[{ title, content, path }]' },
      sourceCount: { label: 'Source count', source: 'AI Graph source set', availability: 'Required', example: '4' },
      userQuery: { label: 'Research question', source: 'AI Search input', availability: 'Required', example: '"What changed?"' },
      originalQuery: { label: 'Original research question', source: 'AI Search session', availability: 'Required', example: '"Compare the options"' },
      contextContent: { label: 'Bounded source context', source: 'AI Search session', availability: 'Required', example: '"Sources and report excerpts…"' },
      question: { label: 'Follow-up question', source: 'AI Search input', availability: 'Required', example: '"What is the trade-off?"' },
      period: { label: 'Reporting period', source: 'Skill input', availability: 'Required', example: '"This week"' },
      topic: { label: 'Requested topic', source: 'Skill input', availability: 'Required', example: '"Knowledge graph"' },
      scope: { label: 'Requested scope', source: 'Action or skill input', availability: 'Optional', example: '"Current document"' },
      join: { label: 'Join helper', source: 'Registered Handlebars helper', availability: 'Helper', example: '{{join values ", "}}' }
    };

    function templateVariables(prompt) {
      return String(prompt?.variables ?? '')
        .split(',')
        .map(variable => variable.trim())
        .filter(Boolean);
    }

    function variableDefinition(variable) {
      if (templateVariableDefinitions[variable]) return templateVariableDefinitions[variable];
      const optional = /(?:selection|excerpt|path|before|after|pinned|recent|current|default|hint|note|comment)/i.test(variable);
      const source = variable.startsWith('this.')
        ? 'Current record in this prompt context'
        : 'Action runtime context';
      return {
        label: variable.startsWith('this.') ? variable.slice(5) : variable,
        source,
        availability: optional ? 'Optional' : 'Required',
        explanation: `A run-specific value named “${variable}” assembled by the owning action. It may change on every run and should not be treated as a saved setting.`,
        example: 'Value supplied when this action runs'
      };
    }

    function variableToken(variable) {
      return variable === 'join' ? '{{join …}}' : `{{${variable}}}`;
    }

    function variableDescription(definition) {
      const availability = definition.availability === 'Optional'
        ? ' It is supplied only when available.'
        : definition.availability === 'Helper'
          ? ' This is a registered Handlebars helper rather than a value.'
          : '';
      return `${definition.explanation ?? `${definition.label} comes from ${definition.source}.`}${availability}`;
    }

    const VARIABLE_PREVIEW_LIMIT = 4;

    function variableDisclosureId(prompt, scope) {
      const promptId = String(prompt?.id ?? 'unknown').replace(/[^a-z0-9_-]/gi, '-');
      return `variable-disclosure-${scope}-${promptId}`;
    }

    function renderVariableList(prompt, scope, listClass, noun, field) {
      const variables = templateVariables(prompt);
      const hiddenCount = Math.max(0, variables.length - VARIABLE_PREVIEW_LIMIT);
      const fields = variables.map((variable, index) => field(variable, index >= VARIABLE_PREVIEW_LIMIT)).join('');
      if (!hiddenCount) return `<div class="${listClass}">${fields}</div>`;
      const controlId = variableDisclosureId(prompt, scope);
      return `<input class="variable-disclosure-toggle" id="${controlId}" type="checkbox"><div class="${listClass}">${fields}</div><label class="variable-disclosure-label" for="${controlId}"><span class="more">Show ${hiddenCount} more ${noun}</span><span class="less">Show fewer ${noun}</span></label>`;
    }

    function renderVariableSummary(prompt) {
      const variables = templateVariables(prompt);
      if (!variables.length) {
        return '';
      }
      const field = (variable, hidden) => {
        const definition = variableDefinition(variable);
        return `<span class="variable-inline-item${hidden ? ' variable-extra' : ''}"><code>${escapeHtml(variableToken(variable))}</code><span>${escapeHtml(variableDescription(definition))}</span></span>`;
      };
      return `<div class="variable-summary"><div class="variable-summary-copy"><strong>Template inputs</strong><span>Peak fills these values through Handlebars when the action runs.</span></div>${renderVariableList(prompt, 'summary', 'variable-inline-list', 'inputs', field)}</div>`;
    }

    function renderTemplatePreview(prompt) {
      const variables = templateVariables(prompt);
      if (!variables.length) return '<span>No Handlebars slots declared</span>';
      const visibleVariables = variables.slice(0, 3);
      const moreCount = variables.length - visibleVariables.length;
      return `<span>Template slots</span>${visibleVariables.map(variable => `<code class="template-token">${escapeHtml(variableToken(variable))}</code>`).join('')}${moreCount ? `<span>+${moreCount} more</span>` : ''}`;
    }

    function renderVariableEditorList(prompt) {
      const variables = templateVariables(prompt);
      if (!variables.length) {
        return `<div class="notice">${icons.prompt}<span>No Handlebars fields are declared for this Prompt. It is rendered from its saved text only.</span></div>`;
      }
      const field = (variable, hidden) => {
        const definition = variableDefinition(variable);
        return `<span class="variable-editor-item${hidden ? ' variable-extra' : ''}"><code>${escapeHtml(variableToken(variable))}</code><span>${escapeHtml(variableDescription(definition))}</span></span>`;
      };
      return `<p class="variable-editor-note">Use these exact Handlebars fields in the template. Peak supplies the values at run time; the source context is fixed by the action and is not typed manually here.</p>${renderVariableList(prompt, 'editor', 'variable-editor-list', 'variables', field)}`;
    }

    function inspectorHeader(item, type) {
      const isCapability = type === 'capability';
      const subtitle = isCapability
        ? item.description
        : `${item.description ?? 'Registered Prompt template'} ${item.owners ? `Mapped to ${item.owners} AI action${item.owners === 1 ? '' : 's'}.` : 'No top-level AI action is mapped in this design fixture.'}`;
      const breadcrumbs = isCapability ? item.surface : `Prompt Library · ${item.group}`;
      const pill = isCapability ? statusPill(item.status) : promptPill(item);
      return `<div class="inspector-head">
        <div class="breadcrumbs">${breadcrumbs}</div>
        <div class="inspector-title-row"><h1>${item.title}</h1>${pill}</div>
        <p class="inspector-subtitle">${subtitle}</p>
      </div>`;
    }

    function editorContent(type, promptId) {
      const prompt = promptId ? prompts.find(candidate => candidate.id === promptId) : null;
      const sharedSubtitle = `${activeItem.title} · changes stay scoped to this Configuration view.`;
      if (type === 'prompt') {
        const migrating = prompt?.status === 'migration';
        return {
          title: migrating ? `Review ${prompt?.title ?? promptId}` : `Edit ${prompt?.title ?? promptId}`,
          subtitle: migrating ? 'Registration is required before this runtime instruction can be overridden.' : sharedSubtitle,
          saveDisabled: migrating,
          wide: true,
          body: `${migrating ? `<div class="notice amber">${icons.alert}<span>Move this inline runtime instruction into Prompt Registry and the shared resolver first.</span></div>` : ''}<p class="modal-copy">Use the declared variables directly in the Vault override. Saving or cancelling returns to the same action and scroll position.</p>${renderVariableEditorList(prompt)}<label class="field"><span>Vault override template</span><textarea ${migrating ? 'disabled' : ''} placeholder="No Vault override. Reference declared fields with {{variable}}."></textarea></label><label class="field"><span>Applies to</span><input value="${prompt?.owners ?? 0} mapped AI action${prompt?.owners === 1 ? '' : 's'}" disabled></label>`
        };
      }
      if (type === 'instruction') {
        return { title: 'Edit action instruction', subtitle: sharedSubtitle, body: `<p class="modal-copy">This override affects only <code>${activeItem.id}</code>; the shared Prompt remains unchanged.</p><label class="field"><span>Action instruction</span><textarea>${activeItem.actionInstruction}</textarea></label>` };
      }
      if (type === 'model') {
        return { title: activeItem.executionKind === 'media' ? 'Choose route and model' : 'Choose model', subtitle: sharedSubtitle, body: `<p class="modal-copy">The selection is stored on this capability step, not on a shared Prompt.</p><label class="field"><span>Policy</span><select><option>Use AI Setup default</option><option selected>Override this action</option></select></label><label class="field"><span>Profile and model</span><select><option>${activeItem.route}</option><option>Fast Lookup · configured model</option><option>Research · configured model</option><option>Choose another compatible model…</option></select></label>` };
      }
      if (type === 'agent') {
        return { title: 'Edit agent controls', subtitle: sharedSubtitle, body: `<label class="field"><span>Tool policy</span><select><option>Allow listed read tools</option><option>Ask for every tool</option><option>Disable tools</option></select></label><label class="field"><span>Write-capable tools</span><select><option>Always ask for approval</option><option>Disable</option></select></label><label class="field"><span>Run budget</span><input value="12 turns · 24 tool calls · configured cost limit"></label>` };
      }
      if (type === 'media') {
        return { title: 'Edit job controls', subtitle: sharedSubtitle, body: `<label class="field"><span>Preset</span><select><option>Use route default</option><option>High quality</option><option>Fast preview</option></select></label><label class="field"><span>Quantity or duration</span><input value="1 output"></label><label class="field"><span>Cost confirmation</span><select><option>Always confirm before submit</option><option>Use configured threshold</option></select></label>` };
      }
      if (type === 'scope') {
        return { title: 'Edit scope and thresholds', subtitle: sharedSubtitle, body: `<label class="field"><span>Scope</span><select><option>Owning surface default</option><option>Current document only</option><option>Current Vault</option></select></label><label class="field"><span>Result limit</span><input type="number" value="20"></label><label class="field"><span>Threshold</span><input value="Use owner default"></label>` };
      }
      if (type === 'tool') {
        return { title: 'Edit parent tool policy', subtitle: sharedSubtitle, body: `<p class="modal-copy">This child action inherits the parent run model. Only availability and approval are editable here.</p><label class="field"><span>Availability</span><select><option>Allow for parent run</option><option>Ask before use</option><option>Disable</option></select></label><label class="field"><span>Persistent writes</span><select><option>Always ask</option><option>Disable</option></select></label>` };
      }
      return { title: 'Edit definition', subtitle: sharedSubtitle, body: `<p class="modal-copy">This modal writes through the original owner adapter; Control Center does not create a second definition store.</p><label class="field"><span>Instructions</span><textarea placeholder="User-defined instructions"></textarea></label><label class="field"><span>Model policy</span><select><option>Use owner default</option><option>Override this definition</option></select></label><label class="field"><span>Tools and approval</span><select><option>Use owner policy</option><option>Review permissions…</option></select></label>` };
    }

    function openEditorModal(trigger, type, promptId) {
      const content = editorContent(type, promptId);
      editorReturnFocus = trigger;
      editorInspectorScrollTop = inspector.scrollTop;
      editorModalTitle.textContent = content.title;
      editorModalSubtitle.textContent = content.subtitle;
      editorModalBody.innerHTML = content.body;
      editorModalCancel.textContent = content.cancelText ?? 'Cancel';
      editorModalSave.classList.toggle('hidden', Boolean(content.hideSave));
      editorModalSave.disabled = Boolean(content.saveDisabled);
      editorDialog.classList.toggle('wide', Boolean(content.wide));
      editorModal.classList.remove('hidden');
      editorModalClose.focus();
    }

    function closeEditorModal() {
      editorModal.classList.add('hidden');
      editorDialog.classList.remove('wide');
      inspector.scrollTop = editorInspectorScrollTop;
      editorReturnFocus?.focus();
      editorReturnFocus = null;
    }

    function promptRole(prompt) {
      if (prompt?.system) return 'User';
      if (/suffix/i.test(prompt?.id ?? '')) return 'System extension';
      if (/system|base/i.test(prompt?.id ?? '') || prompt?.kind === 'System prompt') return 'System';
      return prompt?.variables ? 'User' : 'System';
    }

    function renderPromptControls(item) {
      const promptList = item.prompts.map(id => {
        const prompt = prompts.find(candidate => candidate.id === id);
        const actionLabel = prompt?.status === 'migration' ? 'Review migration' : 'Edit prompt';
        const variableSummary = templateVariables(prompt).length ? renderVariableSummary(prompt) : '';
        return `<div class="prompt-box"><div class="prompt-head"><span class="prompt-title"><strong>${prompt?.title ?? id}</strong><span class="pill">${promptRole(prompt)}</span></span><button class="link-button" data-editor="prompt" data-prompt-id="${id}">${actionLabel}</button></div><div class="prompt-body"><div>${prompt?.kind ?? 'Capability prompt'} · ${prompt?.version ?? 'Built-in'}</div><div class="template-preview">${renderTemplatePreview(prompt)}</div></div>${variableSummary}</div>`;
      }).join('');
      const actionInstruction = item.actionInstruction
        ? `<div class="prompt-box"><div class="prompt-head"><strong>Action instruction</strong><button class="link-button" data-editor="instruction">Edit instruction</button></div><div class="prompt-body">${item.actionInstruction}</div></div>`
        : '';
      if (promptList || actionInstruction) return promptList + actionInstruction;
      if (item.executionKind === 'deterministic') return `<div class="notice">${icons.prompt}<span>No text Prompt by design. This action is deterministic; configure its scope and thresholds below.</span></div>`;
      if (item.executionKind === 'media') return `<div class="notice">${icons.prompt}<span>The user writes the generation Prompt when the job starts. Shared route, preset, quantity, duration, and cost controls live here.</span></div>`;
      if (item.executionKind === 'user') return `<div class="notice">${icons.prompt}<span>Definitions are loaded from the live owner registry. Open the owner to edit content, variables, knowledge, and instructions.</span></div>`;
      return `<div class="notice">${icons.prompt}<span>No shared Prompt is registered for this action. It uses user input or a parent Agent tool request.</span></div>`;
    }

    function renderModelControls(item) {
      if (item.executionKind === 'deterministic') {
        return `<div class="notice">${icons.model}<span>This action does not call a text model. There is no model override to configure.</span></div>`;
      }
      if (item.executionKind === 'delegated') {
        return `<div class="notice">${icons.model}<span>This action is a child tool or dispatcher. It inherits the parent Chat or Copilot route and has no separate model override.</span></div>`;
      }
      if (item.executionKind === 'user') {
        return `<div class="route active">${icons.spark}<span><strong>Owner-defined policy</strong><span>Each live definition keeps its own model, tools, and approval policy.</span></span><button class="action-button" data-editor="owner">Edit definition</button></div>`;
      }
      if (item.executionKind === 'media') {
        return `<label class="route active"><input type="radio" name="model-policy" checked><span><strong>Use generation route</strong><span>Resolve a compatible provider, model, and preset at job preflight.</span></span><span class="route-effective">Current<code>${item.route}</code></span></label><div class="route"><span></span><span><strong>Choose route and model</strong><span>Override this media action only.</span></span><button class="action-button" data-editor="model">Choose route</button></div>`;
      }
      const profileLabel = item.executionKind === 'embedding' ? 'embedding Profile' : item.executionKind === 'rerank' ? 'rerank Profile' : 'model';
      return `<label class="route active"><input type="radio" name="model-policy" checked><span><strong>Use the AI Setup default</strong><span>Follows future changes to the shared ${profileLabel} setting.</span></span><span class="route-effective">Current<code>${item.route}</code></span></label><div class="route"><span></span><span><strong>Choose a ${profileLabel} for this action</strong><span>Overrides the default only for this AI action.</span></span><button class="action-button" data-editor="model">Choose ${item.executionKind === 'text' || item.executionKind === 'agent' ? 'model' : 'Profile'}</button></div>`;
    }

    function renderInlineOutputControls(item) {
      return `<div class="section" data-inline-output-controls>
        <h2>Output controls</h2>
        <div class="inline-controls">
          <label class="field"><span>Sampling</span><select data-inline-output-input><option>Use Profile default</option><option>Low variance</option><option>Balanced</option><option>Creative</option></select></label>
          <label class="field"><span>Retry</span><select data-inline-output-input><option>Use runtime default</option><option>Never</option><option>Once</option><option>Twice</option></select></label>
          <label class="field"><span>Maximum output tokens</span><span class="stepper"><button class="stepper-button" type="button" data-stepper-delta="-1" aria-label="Decrease maximum output tokens">${icons.minus}</button><input data-inline-output-input data-stepper-input type="number" value="4096" min="256" max="32768" step="256"><span class="stepper-unit">tokens</span><button class="stepper-button" type="button" data-stepper-delta="1" aria-label="Increase maximum output tokens">${icons.plus}</button></span></label>
          <label class="field"><span>Timeout</span><span class="stepper"><button class="stepper-button" type="button" data-stepper-delta="-1" aria-label="Decrease timeout">${icons.minus}</button><input data-inline-output-input data-stepper-input type="number" value="60" min="5" max="600" step="5"><span class="stepper-unit">seconds</span><button class="stepper-button" type="button" data-stepper-delta="1" aria-label="Increase timeout">${icons.plus}</button></span></label>
        </div>
        <div class="button-row"><span class="inline-save-status" data-inline-save-status></span><button class="action-button primary" data-save-inline-output>Save output controls</button></div>
      </div>`;
    }

    function renderExecutionControls(item) {
      if (item.executionKind === 'agent') {
        return `<div class="section"><h2>Tools, approval &amp; budget</h2><dl class="facts"><dt>Tool policy</dt><dd>Allow listed tools · ask before write-capable tools</dd><dt>Approval</dt><dd>Review before document or Vault change</dd><dt>Budget</dt><dd>Agent turns, tool calls, token and cost limits</dd></dl><div class="button-row"><button class="action-button" data-editor="agent">Edit agent controls</button></div></div>${renderInlineOutputControls(item)}`;
      }
      if (item.executionKind === 'embedding' || item.executionKind === 'rerank') {
        return `<div class="section"><h2>Index &amp; scope</h2><dl class="facts"><dt>Scope</dt><dd>Changed documents and explicit rebuilds</dd><dt>Batch policy</dt><dd>Profile-compatible batch size and retry</dd><dt>Compatibility</dt><dd>Locked vector/index invariant</dd></dl><div class="button-row"><button class="action-button" data-editor="scope">Edit scope</button></div></div>`;
      }
      if (item.executionKind === 'media') {
        return `<div class="section"><h2>Job controls</h2><dl class="facts"><dt>Preset</dt><dd>Aspect, quality, duration, or transcription mode</dd><dt>Quantity</dt><dd>Per-run generation count</dd><dt>Confirmation</dt><dd>Require cost and provider preflight</dd></dl><div class="button-row"><button class="action-button" data-editor="media">Edit job controls</button></div></div>`;
      }
      if (item.executionKind === 'deterministic') {
        return `<div class="section"><h2>Scope &amp; thresholds</h2><dl class="facts"><dt>Scope</dt><dd>Owning surface and eligible files</dd><dt>Thresholds</dt><dd>Similarity, freshness, or result limits where applicable</dd><dt>AI calls</dt><dd>None</dd></dl><div class="button-row"><button class="action-button" data-editor="scope">Edit scope</button></div></div>`;
      }
      if (item.executionKind === 'delegated') {
        return `<div class="section"><h2>Parent tool policy</h2><dl class="facts"><dt>Availability</dt><dd>Allow or deny this tool for the parent Assistant / Copilot run</dd><dt>Approval</dt><dd>Ask before persistent artifact creation</dd><dt>Model route</dt><dd>Inherited from the parent run</dd></dl><div class="button-row"><button class="action-button" data-editor="tool">Edit tool policy</button></div></div>`;
      }
      if (item.executionKind === 'user') {
        return `<div class="section"><h2>Dynamic owner</h2><dl class="facts"><dt>Source</dt><dd>Live runtime registry</dd><dt>Controls</dt><dd>Content, model, tools, approval, scope</dd><dt>Persistence</dt><dd>Saved through the original owner adapter</dd></dl><div class="button-row"><button class="action-button" data-editor="owner">Edit definition</button></div></div>`;
      }
      return renderInlineOutputControls(item);
    }

    function renderCapabilityInspector(item) {
      inspector.innerHTML = inspectorHeader(item, 'capability') + `
        <section class="panel active">
          <div class="section"><h2>Availability</h2><label class="route active"><input type="checkbox" checked><span><strong>Enable this action</strong><span>Applies to this capability-step owner without changing other actions.</span></span><span class="pill green">On</span></label></div>
          <div class="section"><h2>${item.executionKind === 'media' ? 'Route & model' : 'Model policy'}</h2>${renderModelControls(item)}</div>
          ${renderExecutionControls(item)}
          <div class="section"><h2>Prompt &amp; instructions</h2>${renderPromptControls(item)}</div>
        </section>`;
    }

    function renderPromptInspector(item) {
      const migrating = item.status === 'migration';
      const editor = migrating
        ? `<div class="notice amber">${icons.alert}<span>This live runtime instruction must enter PromptId and the shared resolver before it can be overridden.</span></div><div class="prompt-box"><div class="prompt-head"><strong>Runtime source</strong><span class="pill amber">Registration required</span></div><textarea class="prompt-editor" disabled placeholder="Current inline runtime instruction; override unavailable until migration."></textarea><div class="button-row"><button class="action-button" disabled>Reset</button><button class="action-button primary" disabled>Save override</button></div></div>`
        : `<div class="prompt-box"><div class="prompt-head"><strong>Vault override</strong><button class="link-button">View built-in default</button></div><textarea class="prompt-editor" placeholder="No Vault override. Add instructions here to override the built-in default."></textarea><div class="button-row"><button class="action-button" disabled>Reset to default</button><button class="action-button primary">Save override</button></div></div>`;
      inspector.innerHTML = inspectorHeader(item, 'prompt') + `<section class="panel active">
        <div class="section"><h2>Usage</h2><dl class="facts"><dt>Category</dt><dd>${item.group}</dd><dt>Used by</dt><dd>${item.owners ? `${item.owners} AI action${item.owners === 1 ? '' : 's'}` : 'Direct runtime caller; no top-level action mapped'}</dd><dt>Runtime callers</dt><dd>${item.callers || 'Companion of an executable Prompt'}</dd><dt>Source</dt><dd>${item.version}</dd></dl></div>
        <div class="section"><h2>Runtime variables</h2>${renderVariableEditorList(item)}</div>
        <div class="section"><h2>Prompt instructions</h2>${editor}</div>
        ${item.owners > 1 ? `<div class="notice">${icons.prompt}<span>This prompt is shared. Saving an override changes the instructions for all ${item.owners} actions that use it.</span></div>` : ''}
      </section>`;
    }

    function renderInspector() {
      if (workspace === 'capabilities') return renderCapabilityInspector(activeItem);
      return renderPromptInspector(activeItem);
    }

    function renderAll() {
      renderRail();
      renderRows();
      renderInspector();
    }

    document.addEventListener('click', event => {
      const inlineOutputSave = event.target.closest('[data-save-inline-output]');
      if (inlineOutputSave) {
        const controls = inlineOutputSave.closest('[data-inline-output-controls]');
        const status = controls?.querySelector('[data-inline-save-status]');
        if (status) status.textContent = 'Saved for this action';
        inlineOutputSave.textContent = 'Saved';
        inlineOutputSave.disabled = true;
        return;
      }

      const stepperButton = event.target.closest('[data-stepper-delta]');
      if (stepperButton) {
        const stepper = stepperButton.closest('.stepper');
        const input = stepper?.querySelector('[data-stepper-input]');
        if (!input) return;
        const step = Number(input.step) || 1;
        const minimum = Number(input.min);
        const maximum = Number(input.max);
        const current = Number(input.value);
        const base = Number.isFinite(current) ? current : Number.isFinite(minimum) ? minimum : 0;
        const requested = base + Number(stepperButton.dataset.stepperDelta) * step;
        const bounded = Math.min(Number.isFinite(maximum) ? maximum : requested, Math.max(Number.isFinite(minimum) ? minimum : requested, requested));
        input.value = String(bounded);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        return;
      }

      const editorButton = event.target.closest('[data-editor]');
      if (editorButton) {
        openEditorModal(editorButton, editorButton.dataset.editor, editorButton.dataset.promptId);
        return;
      }

      const catalogButton = event.target.closest('[data-catalog="prompts"]');
      if (catalogButton) {
        workspace = 'prompts';
        activeItem = prompts[0];
        searchInput.value = '';
        renderAll();
        return;
      }

      const groupButton = event.target.closest('[data-group]');
      if (groupButton) {
        workspace = 'capabilities';
        activeGroup = groupButton.dataset.group;
        const visible = capabilities.filter(item => activeGroup === 'all' || item.group === activeGroup);
        if (visible.length) activeItem = visible[0];
        searchInput.value = '';
        renderAll();
        return;
      }

      const row = event.target.closest('[data-id]');
      if (row) {
        workspace = 'capabilities';
        activeItem = capabilities.find(item => item.id === row.dataset.id);
        renderRail();
        renderRows();
        renderInspector();
        return;
      }

      const promptRowButton = event.target.closest('[data-prompt-id]');
      if (promptRowButton) {
        workspace = 'prompts';
        activeItem = prompts.find(item => item.id === promptRowButton.dataset.promptId);
        renderRail();
        renderRows();
        renderInspector();
        return;
      }

    });

    editorModalClose.addEventListener('click', closeEditorModal);
    editorModalCancel.addEventListener('click', closeEditorModal);
    editorModalSave.addEventListener('click', closeEditorModal);
    editorModal.addEventListener('click', event => {
      if (event.target === editorModal) closeEditorModal();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !editorModal.classList.contains('hidden')) closeEditorModal();
    });
    document.addEventListener('input', event => {
      const inlineField = event.target.closest('[data-inline-output-input]');
      if (!inlineField) return;
      const controls = inlineField.closest('[data-inline-output-controls]');
      const save = controls?.querySelector('[data-save-inline-output]');
      const status = controls?.querySelector('[data-inline-save-status]');
      if (save) {
        save.textContent = 'Save output controls';
        save.disabled = false;
      }
      if (status) status.textContent = '';
    });
    searchInput.addEventListener('input', renderRows);
    renderAll();
  </script>
</body>
</html>
