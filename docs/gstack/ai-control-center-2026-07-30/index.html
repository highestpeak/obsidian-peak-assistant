<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peak · AI Control Center design mock</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f3;
      --surface: #ffffff;
      --surface-2: #fafaf8;
      --surface-3: #f1f1ee;
      --line: #e3e3df;
      --line-strong: #d2d2cc;
      --text: #282825;
      --muted: #73736d;
      --subtle: #989890;
      --accent: #6557c8;
      --accent-soft: #f0edff;
      --green: #317259;
      --green-soft: #e9f4ed;
      --amber: #8a641e;
      --amber-soft: #fbf1dc;
      --red: #9b4545;
      --red-soft: #faebeb;
      --blue: #366f9c;
      --blue-soft: #eaf2f8;
      --radius: 8px;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--text); background: var(--bg); font: 13px/1.45 var(--font); }
    button, input { color: inherit; font: inherit; }
    button { cursor: pointer; }
    svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .hidden { display: none !important; }

    .app {
      display: grid;
      grid-template-rows: 40px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      background: var(--surface);
    }

    .tabbar {
      display: flex;
      align-items: stretch;
      padding-left: 48px;
      border-bottom: 1px solid #d8d8d4;
      background: #ececea;
    }

    .obsidian-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
      padding: 0 14px;
      background: var(--surface);
      border-top: 2px solid var(--accent);
      border-right: 1px solid #d8d8d4;
      font-weight: 620;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(250px, 1fr) minmax(280px, 420px);
      gap: 18px;
      align-items: center;
      min-height: 56px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .title {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 10px;
    }

    .title strong { font-size: 16px; white-space: nowrap; }
    .title span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .search {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search svg { position: absolute; left: 10px; color: var(--subtle); pointer-events: none; }
    .search input {
      width: 100%;
      height: 34px;
      padding: 0 12px 0 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: 0;
      background: var(--surface-2);
    }

    .search input:focus {
      border-color: #aaa1dc;
      background: white;
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .shell {
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
      min-height: 0;
    }

    .body {
      display: grid;
      grid-template-columns: 224px minmax(330px, 430px) minmax(520px, 1fr);
      min-height: 0;
    }

    .rail, .list, .inspector { min-height: 0; overflow: auto; }
    .rail { padding: 14px 10px; border-right: 1px solid var(--line); background: var(--surface-2); }
    .list { border-right: 1px solid var(--line); background: var(--surface); }
    .inspector { background: var(--surface); }

    .rail-title {
      padding: 0 9px 8px;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 700;
    }

    .rail-button {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 36px;
      padding: 7px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      text-align: left;
    }

    .rail-button:hover { background: var(--surface-3); }
    .rail-button.active { color: var(--accent); background: var(--accent-soft); }
    .rail-button small { color: var(--subtle); }
    .rail-separator { height: 1px; margin: 12px 8px; background: var(--line); }

    .list-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 15px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
    }

    .list-head strong { display: block; font-size: 14px; }
    .list-head span { display: block; margin-top: 3px; color: var(--muted); }

    .rows { padding: 6px; }
    .row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 10px;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      text-align: left;
    }

    .row:hover { background: var(--surface-2); }
    .row.active { background: var(--accent-soft); }
    .row-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: var(--muted);
    }

    .row.active .row-icon { color: var(--accent); border-color: #cfc8f1; }
    .row-copy { min-width: 0; }
    .row-title { display: block; overflow: hidden; font-weight: 650; white-space: nowrap; text-overflow: ellipsis; }
    .row-meta { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); white-space: nowrap; text-overflow: ellipsis; }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.green { color: var(--green); background: var(--green-soft); }
    .pill.amber { color: var(--amber); background: var(--amber-soft); }
    .pill.red { color: var(--red); background: var(--red-soft); }
    .pill.blue { color: var(--blue); background: var(--blue-soft); }
    .pill.purple { color: var(--accent); background: var(--accent-soft); }

    .inspector-head {
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 18px 22px 0;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
    }

    .breadcrumbs { color: var(--muted); font-size: 11px; }
    .inspector-title-row { display: flex; align-items: flex-start; gap: 12px; margin-top: 7px; }
    .inspector-title-row h1 { flex: 1; margin: 0; font-size: 21px; line-height: 1.25; }
    .inspector-subtitle { max-width: 820px; margin: 7px 0 14px; color: var(--muted); font-size: 13px; }
    .inspector-tabs { display: flex; gap: 18px; }
    .inspector-tab {
      height: 34px;
      padding: 0;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 620;
    }

    .inspector-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .panel { display: none; padding: 20px 22px 80px; }
    .panel.active { display: block; }

    .section { margin-bottom: 24px; }
    .section h2 { margin: 0 0 10px; font-size: 14px; }
    .section p { margin: 0; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card { padding: 13px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
    .card strong { display: block; margin-bottom: 4px; }
    .card span { color: var(--muted); }

    .facts {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      margin: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .facts dt, .facts dd { margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .facts dt { color: var(--muted); background: var(--surface-2); }
    .facts dd { min-width: 0; }
    .facts dt:last-of-type, .facts dd:last-of-type { border-bottom: 0; }
    code { font-family: var(--mono); font-size: 11px; }

    .notice {
      display: flex;
      gap: 10px;
      padding: 12px;
      border: 1px solid #dcd6f5;
      border-radius: var(--radius);
      color: #514797;
      background: var(--accent-soft);
    }

    .notice svg { flex: 0 0 auto; margin-top: 1px; }
    .flow { display: grid; gap: 10px; }
    .flow-stage {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .flow-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px;
      border-right: 1px solid var(--line);
      background: var(--surface-2);
      font-weight: 700;
    }

    .steps { display: grid; gap: 0; }
    .step {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 9px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .step:last-child { border-bottom: 0; }
    .step-num { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--muted); background: var(--surface-3); font-size: 10px; font-weight: 700; }
    .step strong { display: block; }
    .step span { display: block; margin-top: 2px; color: var(--muted); }

    .prompt-box {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .prompt-box + .prompt-box { margin-top: 9px; }
    .prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .prompt-body { margin-top: 9px; padding: 11px; border: 1px solid var(--line); border-radius: 6px; background: white; color: #50504b; font: 11px/1.55 var(--mono); white-space: pre-wrap; }

    .prompt-editor {
      width: 100%;
      min-height: 210px;
      margin-top: 10px;
      padding: 12px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      outline: 0;
      background: white;
      color: #50504b;
      font: 11px/1.6 var(--mono);
    }

    .prompt-editor:focus { border-color: #aaa1dc; box-shadow: 0 0 0 2px var(--accent-soft); }

    .button-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .action-button {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: white;
      font-weight: 620;
    }

    .action-button.primary { color: white; border-color: var(--accent); background: var(--accent); }

    .route {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-top: 9px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .route.active { border-color: #cfc8f1; background: var(--accent-soft); }
    .route input { accent-color: var(--accent); }
    .route strong, .route span { display: block; }
    .route span { color: var(--muted); }
    .route-effective { text-align: right; }
    .route-effective code { display: block; color: var(--text); margin-top: 3px; }

    .link-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-weight: 620;
    }

    .empty { padding: 30px 18px; color: var(--muted); text-align: center; }
    .design-note {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 20;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--subtle);
      background: rgba(255,255,255,.92);
      font: 10px var(--mono);
    }

    @media (max-width: 1120px) {
      .body { grid-template-columns: 190px 340px minmax(460px, 1fr); }
      .topbar { grid-template-columns: 1fr; }
      .search { display: none; }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="tabbar">
      <div class="obsidian-tab">
        <svg viewBox="0 0 24 24"><path d="M12 3 4.5 7.3v9.4L12 21l7.5-4.3V7.3z"/><path d="m8 11 2.5 2.5L16 8"/></svg>
        <span>AI Control Center</span>
      </div>
    </div>

    <div class="shell">
      <header class="topbar">
        <div class="title">
          <strong>AI Control Center</strong>
          <span>Manage AI actions and shared prompts</span>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
          <input id="searchInput" type="search" placeholder="Search AI actions or prompts…">
        </label>
      </header>

      <div class="body">
        <aside class="rail" id="rail"></aside>
        <section class="list">
          <div class="list-head"><strong id="listTitle">All AI actions</strong><span id="listDescription">Choose an action to review its behavior and configuration.</span></div>
          <div class="rows" id="rows"></div>
        </section>
        <main class="inspector" id="inspector"></main>
      </div>
    </div>
  </div>

  <div class="design-note">Design mock · no product settings are changed</div>

  <script>
    const icons = {
      search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>',
      spark: '<svg viewBox="0 0 24 24"><path d="m12 3 1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="m18 15 .8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg>',
      graph: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="m7 11 9-4M7 13l9 4"/></svg>',
      file: '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h5"/></svg>',
      message: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>',
      vault: '<svg viewBox="0 0 24 24"><path d="m12 3 7 4v10l-7 4-7-4V7z"/><path d="m8 9 4 2 4-2M12 11v6"/></svg>',

      database: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg>',
      prompt: '<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h6M8 16h4"/></svg>',

      run: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      alert: '<svg viewBox="0 0 24 24"><path d="M12 3 2.8 19h18.4z"/><path d="M12 9v4M12 17h.01"/></svg>',
      all: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>'
    };

    const capabilities = [
      {
        id: 'search.query.refine',

        group: 'search',
        icon: 'search',
        surface: 'Vault Search',
        shape: 'Single structured call',
        status: 'partial',

        description: 'Turn the current query and recent search behavior into grounded Hyper Search candidates without starting AI Search.',
        success: 'Shows 3–5 valid query candidates with short grounding reasons. Selecting one fills the search box; it does not silently run a new search.',

        prompts: ['query-rewrite-system', 'query-rewrite'],

      {

        status: 'live',
        route: 'Research → Stronger',
        description: 'Investigate a Vault question by planning, using Vault tools, collecting evidence, and producing a reviewable report plan.',

      {

      {

        output: 'AI Graph artifact',
        review: 'Graph detail + Sources',

        before: [

          ['Resolve model', 'Current Agent role, fixed for the run.']
        ],

      },
      {

        title: 'Composer · Transform prose',

        status: 'live',
        route: 'Copilot / Agent binding',
        description: 'Generate a source-safe candidate for prose, heading, list, task, quote, or callout actions without writing before acceptance.',

        mustNot: 'Must not write into the Vault during generation or reuse stale selection offsets.',
        prompts: ['composer-prose-transform'],
        tools: ['Context snapshot', 'Transaction hub'],
        output: 'Text patch / block insertion / list item patch',
        review: 'Inline candidate + Generation History',
        evidence: ['Registered', 'Referenced', 'Reachable', 'Receipted'],
        before: [

        ],

        ],
        after: [
          ['Materialize result', 'Parse the action-specific result kind and renderer.'],
          ['Review candidate', 'Accept, reject, regenerate, or switch variant.'],
          ['Commit and reparse', 'One transaction, then reparse the updated Markdown.']
        ]
      },
      {
        id: 'copilot.vault.review',
        title: 'Vault Intelligence · Review Vault',
        group: 'intelligence',
        icon: 'vault',
        surface: 'Composer Copilot · Vault',
        shape: 'Fixed-model tool loop',
        status: 'partial',
        route: 'Agent / Agent Fast',
        description: 'Review whole-Vault signals, use tools, and collect findings, sources, proposed actions, and trace receipts across one or more rounds.',
        success: 'Produces a review snapshot whose findings can be explained, located, or turned into reviewable changes.',
        mustNot: 'Must not duplicate a Chat session, expose hidden reasoning, or lose unaccepted findings.',
        prompts: ['vault-meta-agent-system-base', 'vault-meta-agent-fast-mode-suffix', 'vault-meta-agent-complete-mode-suffix'],
        tools: ['propose_action', 'propose_source', 'note_finding', 'submit_review'],
        output: 'Vault review snapshot',
        review: 'Changes / Insights / Sources / Trace',
        evidence: ['Registered', 'Referenced', 'Receipted'],
        before: [
          ['Build Vault digest', 'Fingerprint, freshness, active theme, signals, and prior review.'],
          ['Select mode', 'Fast or complete selects a fixed binding and suffix.']
        ],
        during: [
          ['Run review round', 'Tool loop records findings and source evidence.'],
          ['Continue or finish', 'submit_review controls another compacted round or completion.']
        ],
        after: [
          ['Build artifacts', 'Changes, Insights, Sources, and Trace stay in one run receipt.'],
          ['Persist history', 'Completed and cancelled review snapshots remain recoverable.']
        ]
      },
      {
        id: 'chat.conversation.run',
        title: 'Chat Studio · Conversation turn',
        group: 'chat',
        icon: 'message',
        surface: 'Chat Studio Composer',
        shape: 'Fixed-model AgentLoop',
        status: 'live',
        route: 'Conversation / Assistant override',
        description: 'Assemble conversation context, route the selected Assistant and model, run allowed tools, and stream one recoverable turn.',
        success: 'Streams text and tool states, persists one turn receipt, and links generated artifacts back to the message.',
        mustNot: 'Must not reintroduce a second tool loop, bypass Assistant deny rules, or hide the actual model used.',
        prompts: ['conversation-system', 'plan-mode-system'],
        tools: ['Vault search', 'Web search', 'MCP', 'artifact_create', 'media_generate'],
        output: 'Assistant message + artifacts',
        review: 'Message actions + Resources',
        evidence: ['Registered', 'Referenced', 'Reachable', 'Receipted'],
        before: [
          ['Resolve Assistant', 'Instructions, knowledge refs, tool policy, and preferred model.'],
          ['Assemble context', 'System, profile, project, files, messages, and budget receipts.'],
          ['Build tools', 'Apply availability, capability, allow/deny, and permission checks.']
        ],
        during: [
          ['Run AgentLoop', 'One fixed model streams text and tool events.'],
          ['Handle permission', 'Ask-required tools suspend until a user decision arrives.']
        ],
        after: [
          ['Save message', 'Persist final status, finish reason, and actual model.'],
          ['Link artifacts', 'Generated media and structured artifacts attach to the turn.'],
          ['Offer follow-ups', 'Suggestions are a separate helper linked to this turn.']
        ]
      },
      {
        id: 'media.generate',
        title: 'Generation · Image, video, or music',
        group: 'chat',
        icon: 'image',
        surface: 'Chat Studio / Composer',
        shape: 'Durable media job',
        status: 'partial',
        route: 'Media route preflight',
        description: 'Preflight provider, model, capability, cost, references, and policy before submitting a media generation job.',
        success: 'Returns one or more durable media receipts, survives async polling, and writes files only through the media attachment owner.',
        mustNot: 'Must not silently switch billing providers, skip music terms, or mark an untested paid route as verified.',
        prompts: [],
        tools: ['fal adapter', 'OpenAI native adapter', 'Media attachment writer'],
        output: 'Media job receipts + files',
        review: 'Gallery / Resources / Composer candidate',
        evidence: ['Registered', 'Referenced', 'Receipted'],
        before: [
          ['Run preflight', 'Route, model, profile, capability, quantity, references, mask, and policy.'],
          ['Confirm cost or terms', 'Required confirmation becomes a durable job state.']
        ],
        during: [
          ['Submit job', 'Native or fal adapter receives the normalized request.'],
          ['Poll or stream', 'Durable async jobs can be cancelled, retried, and resumed.']
        ],
        after: [
          ['Download and validate', 'Validate bytes, media type, expected quantity, and paths.'],
          ['Write attachment', 'Use the configured writer and emit usage receipts.']
        ]
      },
      {
        id: 'knowledge.index.embedding',
        title: 'Knowledge Index · Embedding',
        group: 'knowledge',
        icon: 'database',
        surface: 'Index build and semantic search',
        shape: 'Embedding',
        status: 'live',
        route: 'Knowledge Index',
        description: 'Create and query vector representations for document chunks without using a chat Prompt or AgentLoop.',
        success: 'Stores embeddings with model identity and uses the same binding for compatible query vectors.',
        mustNot: 'Must not appear as a Prompt-driven text generation or silently mix incompatible embedding dimensions.',
        prompts: [],
        tools: ['Chunker', 'Embedding client', 'Vector repository'],
        output: 'Embedding vectors',
        review: 'Index status / search receipts',
        evidence: ['Registered', 'Referenced', 'Reachable'],
        before: [
          ['Prepare chunks', 'Normalize document content and determine changed chunks.'],
          ['Resolve binding', 'Knowledge Index Profile and embedding model.']
        ],
        during: [
          ['Embed batch', 'Generate vectors with stable model and dimension metadata.']
        ],
        after: [
          ['Persist vectors', 'Update the rebuildable index and record failures.'],
          ['Query compatibility', 'Semantic search uses a compatible query vector.']
        ]
      }
    ];

    const prompts = [
      { id: 'composer-prose-transform', title: 'Composer prose transform', group: 'Composer', kind: 'Shared executable prompt', owners: 18, version: 'Built-in + Vault override', status: 'live' },
      { id: 'query-rewrite', title: 'Vault Search query rewrite', group: 'Search', kind: 'Executable prompt', owners: 1, version: 'Built-in', status: 'live' },
      { id: 'ai-analysis-report-section', title: 'Generate report section', group: 'AI Search', kind: 'Workflow step prompt', owners: 1, version: 'Built-in', status: 'live' },
      { id: 'conversation-system', title: 'Conversation system', group: 'Chat', kind: 'Context template', owners: 1, version: 'Built-in + dynamic slots', status: 'live' },
      { id: 'vault-meta-agent-system-base', title: 'Vault review base', group: 'Vault Intelligence', kind: 'System fragment', owners: 1, version: 'Built-in', status: 'partial' },
      { id: 'gap-explanation', title: 'Gap explanation', group: 'Knowledge', kind: 'Registered prompt', owners: 0, version: 'Built-in', status: 'unwired' }
    ];

    for (const capability of capabilities) {
      for (const promptId of capability.prompts) {
        if (prompts.some(prompt => prompt.id === promptId)) continue;
        prompts.push({
          id: promptId,
          title: promptId.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '),
          group: capability.surface,
          kind: 'Capability prompt',
          owners: capabilities.filter(item => item.prompts.includes(promptId)).length,
          version: 'Built-in',
          status: capability.status
        });
      }
    }

    let workspace = 'capabilities';
    let activeGroup = 'all';
    let activeItem = capabilities[0];
    let inspectorTab = 'overview';

    const rail = document.getElementById('rail');
    const rows = document.getElementById('rows');
    const inspector = document.getElementById('inspector');
    const searchInput = document.getElementById('searchInput');
    const listTitle = document.getElementById('listTitle');
    const listDescription = document.getElementById('listDescription');

    const groups = [
      ['all', 'all', 'All AI actions'],
      ['search', 'search', 'Search & Knowledge'],
      ['analysis', 'spark', 'AI Search & Graph'],
      ['composer', 'file', 'Composer & Copilot'],
      ['chat', 'message', 'Chat & Generation'],
      ['intelligence', 'vault', 'Vault Intelligence'],
      ['knowledge', 'database', 'Index & background']
    ];

    function statusPill(status) {
      if (status === 'live') return '<span class="pill green">Available</span>';
      if (status === 'partial') return '<span class="pill amber">Limited</span>';
      if (status === 'unwired') return '<span class="pill red">Unavailable</span>';
      return `<span class="pill">${status}</span>`;
    }

    function promptPill(item) {
      if (item.owners === 0) return '<span class="pill amber">Unused</span>';
      if (item.version.includes('override')) return '<span class="pill purple">Customized</span>';
      return '<span class="pill">Default</span>';
    }

    function renderRail() {
      rail.innerHTML = `<div class="rail-title">AI actions</div>` +
        groups.map(([id, icon, label]) => {
          const count = id === 'all' ? capabilities.length : capabilities.filter(item => item.group === id).length;
          const active = workspace === 'capabilities' && activeGroup === id;
          return `<button class="rail-button ${active ? 'active' : ''}" data-group="${id}">${icons[icon]}<span>${label}</span><small>${count}</small></button>`;
        }).join('') +
        `<div class="rail-separator"></div>
         <div class="rail-title">Prompt library</div>
         <button class="rail-button ${workspace === 'prompts' ? 'active' : ''}" data-catalog="prompts">${icons.prompt}<span>All prompts</span></button>`;
    }

    function capabilityRow(item) {
      return `<button class="row ${activeItem?.id === item.id ? 'active' : ''}" data-id="${item.id}">
        <span class="row-icon">${icons[item.icon]}</span>
        <span class="row-copy">
          <span class="row-title">${item.title}</span>
          <span class="row-meta">${item.shape} · ${item.route}</span>
        </span>
        ${statusPill(item.status)}
      </button>`;
    }

    function promptRow(item) {
      return `<button class="row ${activeItem?.id === item.id ? 'active' : ''}" data-prompt-id="${item.id}">
        <span class="row-icon">${icons.prompt}</span>
        <span class="row-copy">
          <span class="row-title">${item.title}</span>
          <span class="row-meta">${item.group} · Used by ${item.owners} AI action${item.owners === 1 ? '' : 's'}</span>
        </span>
        ${promptPill(item)}
      </button>`;
    }

    function renderRows() {
      const query = searchInput.value.trim().toLowerCase();
      if (workspace === 'capabilities') {
        listTitle.textContent = activeGroup === 'all' ? 'All AI actions' : groups.find(item => item[0] === activeGroup)?.[2] ?? 'AI actions';
        listDescription.textContent = 'Choose an action to review its behavior and configuration.';
        const filtered = capabilities.filter(item => {
          const groupMatch = activeGroup === 'all' || item.group === activeGroup;
          return groupMatch && [item.id, item.title, item.surface, item.shape, item.route].join(' ').toLowerCase().includes(query);
        });
        rows.innerHTML = filtered.length ? filtered.map(capabilityRow).join('') : '<div class="empty">No AI action matches this filter.</div>';
        return;
      }

      listTitle.textContent = 'All prompts';
      listDescription.textContent = 'All registered prompts are flat and searchable; this design fixture shows representative rows.';
      const filtered = prompts.filter(item => [item.id, item.title, item.group, item.kind].join(' ').toLowerCase().includes(query));
      rows.innerHTML = filtered.length ? filtered.map(promptRow).join('') : '<div class="empty">No prompt matches this search.</div>';
    }

    function inspectorHeader(item, type) {
      const isCapability = type === 'capability';
      const subtitle = type === 'capability'
        ? item.description
        : `Used by ${item.owners} AI action${item.owners === 1 ? '' : 's'}. Edit the Vault override without changing the built-in default.`;
      return `<div class="inspector-head">
        <div class="breadcrumbs">${isCapability ? item.surface : `Prompt Library · ${item.group}`}</div>
        <div class="inspector-title-row"><h1>${item.title}</h1>${isCapability ? statusPill(item.status) : promptPill(item)}</div>
        <p class="inspector-subtitle">${subtitle}</p>
        ${isCapability ? `<div class="inspector-tabs">
          <button class="inspector-tab ${inspectorTab === 'overview' ? 'active' : ''}" data-tab="overview">Behavior</button>
          <button class="inspector-tab ${inspectorTab === 'config' ? 'active' : ''}" data-tab="config">Configuration</button>
        </div>` : ''}
      </div>`;
    }

    function renderCapabilityInspector(item) {
      const promptList = item.prompts.length
        ? item.prompts.map(id => {
          const prompt = prompts.find(candidate => candidate.id === id);
          return `<div class="prompt-box"><div class="prompt-head"><strong>${prompt?.title ?? id}</strong><button class="link-button" data-open-prompt="${id}">Edit in Prompt Library</button></div><div class="prompt-body">${prompt?.kind ?? 'Capability prompt'} · ${prompt?.version ?? 'Built-in'}</div></div>`;
        }).join('')
        : '<div class="notice">' + icons.prompt + '<span>This action has no editable text prompt. Its behavior comes from the selected model or embedding service.</span></div>';
      inspector.innerHTML = inspectorHeader(item, 'capability') + `
        <section class="panel ${inspectorTab === 'overview' ? 'active' : ''}" data-panel="overview">
          <div class="section">
            <h2>Expected behavior</h2>
            <div class="cards">
              <div class="card"><strong>What you get</strong><span>${item.success}</span></div>
              <div class="card"><strong>Safety boundary</strong><span>${item.mustNot}</span></div>
            </div>
          </div>
          <div class="section">
            <h2>At a glance</h2>
            <dl class="facts">
              <dt>Available in</dt><dd>${item.surface}</dd>
              <dt>Response style</dt><dd>${item.shape}</dd>
              <dt>Produces</dt><dd>${item.output}</dd>
              <dt>You review it in</dt><dd>${item.review}</dd>
            </dl>
          </div>
        </section>
        <section class="panel ${inspectorTab === 'config' ? 'active' : ''}" data-panel="config">
          <div class="section">
            <h2>Model</h2>
            <label class="route active"><input type="radio" name="model-policy" checked><span><strong>Use the AI Setup default</strong><span>Follows future changes to the shared model setting.</span></span><span class="route-effective">Current<code>${item.route}</code></span></label>
            <label class="route"><input type="radio" name="model-policy"><span><strong>Choose a model for this action</strong><span>Overrides the default only for this AI action.</span></span><button class="action-button">Choose model</button></label>
          </div>
          <div class="section"><h2>Prompt instructions</h2>${promptList}</div>
        </section>`;
    }

    function renderPromptInspector(item) {
      inspector.innerHTML = inspectorHeader(item, 'prompt') + `<section class="panel active">
        <div class="section">
          <h2>Usage</h2>
          <dl class="facts">
            <dt>Category</dt><dd>${item.group}</dd>
            <dt>Used by</dt><dd>${item.owners ? `${item.owners} AI action${item.owners === 1 ? '' : 's'}` : 'No current AI action'}</dd>
            <dt>Source</dt><dd>${item.version}</dd>
          </dl>
        </div>
        <div class="section">
          <h2>Prompt instructions</h2>
          <div class="prompt-box"><div class="prompt-head"><strong>Vault override</strong><button class="link-button">View built-in default</button></div><textarea class="prompt-editor">Keep the response grounded in the provided sources and follow the output requirements for ${item.title}. Preserve user-authored content unless the selected action explicitly asks for a rewrite.</textarea><div class="button-row"><button class="action-button">Reset to default</button><button class="action-button primary">Save override</button></div></div>
        </div>
        ${item.owners > 1 ? `<div class="notice">${icons.prompt}<span>This prompt is shared. Saving an override changes the instructions for all ${item.owners} actions that use it.</span></div>` : ''}
      </section>`;
    }

    function renderInspector() {
      if (workspace === 'capabilities') return renderCapabilityInspector(activeItem);
      return renderPromptInspector(activeItem);
    }

    function renderAll() {
      renderRail();
      renderRows();
      renderInspector();
    }

    document.addEventListener('click', event => {
      const catalogButton = event.target.closest('[data-catalog="prompts"]');
      if (catalogButton) {
        workspace = 'prompts';
        activeItem = prompts[0];
        inspectorTab = 'overview';
        searchInput.value = '';
        renderAll();
        return;
      }

      const groupButton = event.target.closest('[data-group]');
      if (groupButton) {
        workspace = 'capabilities';
        activeGroup = groupButton.dataset.group;
        const visible = capabilities.filter(item => activeGroup === 'all' || item.group === activeGroup);
        if (visible.length) activeItem = visible[0];
        inspectorTab = 'overview';
        searchInput.value = '';
        renderAll();
        return;
      }

      const row = event.target.closest('[data-id]');
      if (row) {
        activeItem = capabilities.find(item => item.id === row.dataset.id);
        inspectorTab = 'overview';
        renderRows();
        renderInspector();
        return;
      }

      const openPromptButton = event.target.closest('[data-open-prompt]');
      if (openPromptButton) {
        const prompt = prompts.find(item => item.id === openPromptButton.dataset.openPrompt);
        if (!prompt) return;
        workspace = 'prompts';
        activeItem = prompt;
        searchInput.value = '';
        renderAll();
        return;
      }

      const promptRowButton = event.target.closest('[data-prompt-id]');
      if (promptRowButton) {
        activeItem = prompts.find(item => item.id === promptRowButton.dataset.promptId);
        renderRows();
        renderInspector();
        return;
      }

      const tab = event.target.closest('[data-tab]');
      if (tab) {
        inspectorTab = tab.dataset.tab;
        renderInspector();
      }
    });

    searchInput.addEventListener('input', renderRows);
    renderAll();
  </script>
</body>
</html>
