<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peak · AI Control Center design mock</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f3;
      --surface: #ffffff;
      --surface-2: #fafaf8;
      --surface-3: #f1f1ee;
      --line: #e3e3df;
      --line-strong: #d2d2cc;
      --text: #282825;
      --muted: #73736d;
      --subtle: #989890;
      --accent: #6557c8;
      --accent-soft: #f0edff;
      --green: #317259;
      --green-soft: #e9f4ed;
      --amber: #8a641e;
      --amber-soft: #fbf1dc;
      --red: #9b4545;
      --red-soft: #faebeb;
      --blue: #366f9c;
      --blue-soft: #eaf2f8;
      --radius: 8px;
      --font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--text); background: var(--bg); font: 13px/1.45 var(--font); }
    button, input { color: inherit; font: inherit; }
    button { cursor: pointer; }
    svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .hidden { display: none !important; }

    .app {
      display: grid;
      grid-template-rows: 40px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      background: var(--surface);
    }

    .tabbar {
      display: flex;
      align-items: stretch;
      padding-left: 48px;
      border-bottom: 1px solid #d8d8d4;
      background: #ececea;
    }

    .obsidian-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
      padding: 0 14px;
      background: var(--surface);
      border-top: 2px solid var(--accent);
      border-right: 1px solid #d8d8d4;
      font-weight: 620;
    }

    .topbar {
      display: flex;
      align-items: center;
      min-height: 56px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .title {
      display: flex;
      align-items: baseline;
      min-width: 0;
      gap: 10px;
    }

    .title strong { font-size: 16px; white-space: nowrap; }
    .title span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .search {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search svg { position: absolute; left: 10px; color: var(--subtle); pointer-events: none; }
    .search input {
      width: 100%;
      height: 34px;
      padding: 0 12px 0 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      outline: 0;
      background: var(--surface-2);
    }

    .search input:focus {
      border-color: #aaa1dc;
      background: white;
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .shell {
      display: grid;
      grid-template-rows: 56px minmax(0, 1fr);
      min-height: 0;
    }

    .body {
      display: grid;
      grid-template-columns: 224px minmax(330px, 430px) minmax(520px, 1fr);
      min-height: 0;
    }

    .rail, .list, .inspector { min-height: 0; overflow: auto; }
    .rail { padding: 14px 10px; border-right: 1px solid var(--line); background: var(--surface-2); }
    .list { border-right: 1px solid var(--line); background: var(--surface); }
    .inspector { background: var(--surface); }

    .rail-title {
      padding: 0 9px 8px;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 700;
    }

    .rail-button {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 36px;
      padding: 7px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      text-align: left;
    }

    .rail-button:hover { background: var(--surface-3); }
    .rail-button.active { color: var(--accent); background: var(--accent-soft); }
    .rail-button small { color: var(--subtle); }
    .rail-separator { height: 1px; margin: 12px 8px; background: var(--line); }

    .list-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 15px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
    }

    .list-head strong { display: block; font-size: 14px; }
    .list-head span { display: block; margin-top: 3px; color: var(--muted); }
    .list-head .search { margin-top: 10px; }

    .rows { padding: 6px; }
    .family-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 10px 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .01em;
    }
    .family-head:first-child { padding-top: 7px; }
    .family-head small { color: var(--subtle); font-weight: 650; }
    .row {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr) auto;
      gap: 10px;
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      text-align: left;
    }

    .row:hover { background: var(--surface-2); }
    .row.active { background: var(--accent-soft); }
    .row-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: var(--muted);
    }

    .row.active .row-icon { color: var(--accent); border-color: #cfc8f1; }
    .row-copy { min-width: 0; }
    .row-title { display: block; overflow: hidden; font-weight: 650; white-space: nowrap; text-overflow: ellipsis; }
    .row-meta { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); white-space: nowrap; text-overflow: ellipsis; }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.green { color: var(--green); background: var(--green-soft); }
    .pill.amber { color: var(--amber); background: var(--amber-soft); }
    .pill.red { color: var(--red); background: var(--red-soft); }
    .pill.blue { color: var(--blue); background: var(--blue-soft); }
    .pill.purple { color: var(--accent); background: var(--accent-soft); }

    .inspector-head {
      position: sticky;
      top: 0;
      z-index: 3;
      padding: 18px 22px 0;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
    }

    .breadcrumbs { color: var(--muted); font-size: 11px; }
    .inspector-title-row { display: flex; align-items: flex-start; gap: 12px; margin-top: 7px; }
    .inspector-title-row h1 { flex: 1; margin: 0; font-size: 21px; line-height: 1.25; }
    .inspector-subtitle { max-width: 820px; margin: 7px 0 14px; color: var(--muted); font-size: 13px; }
    .inspector-tabs { display: flex; gap: 18px; }
    .inspector-tab {
      height: 34px;
      padding: 0;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 620;
    }

    .inspector-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .panel { display: none; padding: 20px 22px 80px; }
    .panel.active { display: block; }

    .section { margin-bottom: 24px; }
    .section h2 { margin: 0 0 10px; font-size: 14px; }
    .section p { margin: 0; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card { padding: 13px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
    .card strong { display: block; margin-bottom: 4px; }
    .card span { color: var(--muted); }

    .facts {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      margin: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .facts dt, .facts dd { margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .facts dt { color: var(--muted); background: var(--surface-2); }
    .facts dd { min-width: 0; }
    .facts dt:last-of-type, .facts dd:last-of-type { border-bottom: 0; }
    code { font-family: var(--mono); font-size: 11px; }

    .notice {
      display: flex;
      gap: 10px;
      padding: 12px;
      border: 1px solid #dcd6f5;
      border-radius: var(--radius);
      color: #514797;
      background: var(--accent-soft);
    }

    .notice svg { flex: 0 0 auto; margin-top: 1px; }
    .flow { display: grid; gap: 10px; }
    .flow-stage {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .flow-label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px;
      border-right: 1px solid var(--line);
      background: var(--surface-2);
      font-weight: 700;
    }

    .steps { display: grid; gap: 0; }
    .step {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: 9px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }

    .step:last-child { border-bottom: 0; }
    .step-num { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: var(--muted); background: var(--surface-3); font-size: 10px; font-weight: 700; }
    .step strong { display: block; }
    .step span { display: block; margin-top: 2px; color: var(--muted); }

    .prompt-box {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .prompt-box + .prompt-box { margin-top: 9px; }
    .prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .prompt-body { margin-top: 9px; padding: 11px; border: 1px solid var(--line); border-radius: 6px; background: white; color: #50504b; font: 11px/1.55 var(--mono); white-space: pre-wrap; }

    .prompt-editor {
      width: 100%;
      min-height: 210px;
      margin-top: 10px;
      padding: 12px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      outline: 0;
      background: white;
      color: #50504b;
      font: 11px/1.6 var(--mono);
    }

    .prompt-editor:focus { border-color: #aaa1dc; box-shadow: 0 0 0 2px var(--accent-soft); }

    .button-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
    .action-button {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: white;
      font-weight: 620;
    }

    .action-button.primary { color: white; border-color: var(--accent); background: var(--accent); }

    .route {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      margin-top: 9px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-2);
    }

    .route.active { border-color: #cfc8f1; background: var(--accent-soft); }
    .route input { accent-color: var(--accent); }
    .route strong, .route span { display: block; }
    .route span { color: var(--muted); }
    .route-effective { text-align: right; }
    .route-effective code { display: block; color: var(--text); margin-top: 3px; }

    .link-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-weight: 620;
    }

    .empty { padding: 30px 18px; color: var(--muted); text-align: center; }
    .design-note {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 20;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--subtle);
      background: rgba(255,255,255,.92);
      font: 10px var(--mono);
    }

    @media (max-width: 1120px) {
      .body { grid-template-columns: 190px 340px minmax(460px, 1fr); }
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="tabbar">
      <div class="obsidian-tab">
        <svg viewBox="0 0 24 24"><path d="M12 3 4.5 7.3v9.4L12 21l7.5-4.3V7.3z"/><path d="m8 11 2.5 2.5L16 8"/></svg>
        <span>AI Control Center</span>
      </div>
    </div>

    <div class="shell">
      <header class="topbar">
        <div class="title">
          <strong>AI Control Center</strong>
          <span>Manage AI actions and shared prompts</span>
        </div>
      </header>

      <div class="body">
        <aside class="rail" id="rail"></aside>
        <section class="list">
          <div class="list-head">
            <strong id="listTitle">All AI actions</strong>
            <span id="listDescription">Choose an action to review its behavior and configuration.</span>
            <label class="search">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
              <input id="searchInput" type="search" placeholder="Search this list…">
            </label>
          </div>
          <div class="rows" id="rows"></div>
        </section>
        <main class="inspector" id="inspector"></main>
      </div>
    </div>
  </div>

  <div class="design-note">Design mock · no product settings are changed</div>

  <script src="prompt-catalog-data.js"></script>
  <script>
    const icons = {
      search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>',
      spark: '<svg viewBox="0 0 24 24"><path d="m12 3 1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="m18 15 .8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg>',
      graph: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="m7 11 9-4M7 13l9 4"/></svg>',
      file: '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h5"/></svg>',
      message: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg>',
      vault: '<svg viewBox="0 0 24 24"><path d="m12 3 7 4v10l-7 4-7-4V7z"/><path d="m8 9 4 2 4-2M12 11v6"/></svg>',
      image: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m4 17 5-5 4 4 2-2 5 5"/></svg>',
      database: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg>',
      prompt: '<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h6M8 16h4"/></svg>',
      model: '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>',
      run: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      alert: '<svg viewBox="0 0 24 24"><path d="M12 3 2.8 19h18.4z"/><path d="M12 9v4M12 17h.01"/></svg>',
      all: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>'
    };

    const actionDefaults = {
      search: {
        icon: 'search', surface: 'Search workspace', shape: 'Search or agent workflow', status: 'live', route: 'Search / Research',
        success: 'Returns a grounded result that stays attached to its query, sources, and originating workspace.',
        mustNot: 'Must not invent Vault evidence, merge separate run identities, or silently write an unreviewed result.',
        tools: ['Search context', 'Source receipts'], output: 'Grounded search result', review: 'Search workspace',
        before: [['Freeze request', 'Capture query, scope, selected sources, current result, and run identity.']],
        during: [['Run the selected behavior', 'Use the registered prompt, model policy, and tools for this action.']],
        after: [['Validate and attach', 'Keep sources, artifacts, and follow-ups attached to the same search workspace.']]
      },
      composer: {
        icon: 'file', surface: 'Composer / Copilot', shape: 'Review-before-write candidate', status: 'live', route: 'Copilot / Agent',
        success: 'Produces a source-safe candidate against a frozen target and changes the document only after explicit acceptance.',
        mustNot: 'Must not write while generating, reuse stale source offsets, or collapse distinct block actions into one opaque prompt.',
        tools: ['Frozen Composer context', 'Candidate materializer', 'Transaction hub'], output: 'Typed candidate or review artifact', review: 'Inline candidate / Copilot review',
        before: [['Freeze target', 'Capture document revision, block or selection, nearby context, and requested action.']],
        during: [['Generate candidate', 'Run the action-specific instruction and stream or collect its typed result.']],
        after: [['Review and commit', 'Accept, reject, retry, or apply one revision-checked transaction.']]
      },
      chat: {
        icon: 'message', surface: 'Chat Studio', shape: 'Conversation helper or durable job', status: 'live', route: 'Conversation / Media',
        success: 'Returns a recoverable message, helper result, or generated artifact with its actual model and source context.',
        mustNot: 'Must not bypass Assistant tool policy, lose job receipts, or present an internal helper as user-authored content.',
        tools: ['Conversation context', 'Assistant policy', 'Artifact receipts'], output: 'Message, suggestion, or artifact', review: 'Chat message / Resources',
        before: [['Assemble context', 'Resolve conversation, Assistant, sources, permissions, and requested output.']],
        during: [['Run helper or job', 'Stream a turn, call a focused helper, or execute a durable generation job.']],
        after: [['Persist result', 'Attach output, actual route, errors, and artifacts to the owning conversation.']]
      },
      intelligence: {
        icon: 'vault', surface: 'Vault Intelligence', shape: 'Vault scan, action, or review', status: 'live', route: 'Agent / Agent Fast',
        success: 'Produces evidence-backed Vault findings or proposals that remain reviewable before any content change.',
        mustNot: 'Must not treat heuristics as model conclusions, fabricate note paths, or apply batch changes without review.',
        tools: ['Vault digest', 'Search and graph signals', 'Review artifacts'], output: 'Vault finding, proposal, or review snapshot', review: 'Vault Intelligence',
        before: [['Build Vault evidence', 'Collect the bounded fingerprint, findings, scope, freshness, and current review mode.']],
        during: [['Analyze or propose', 'Run the registered action or review loop against real Vault evidence.']],
        after: [['Keep proposals reviewable', 'Persist findings, sources, and suggested actions without silent writeback.']]
      },
      system: {
        icon: 'database', surface: 'System background', shape: 'Background AI step', status: 'support', route: 'Purpose-specific binding',
        success: 'Completes one bounded support task and records enough identity to explain cost, freshness, and downstream use.',
        mustNot: 'Must not masquerade as a user action, mix incompatible model outputs, or create user-owned content silently.',
        tools: ['Scheduled input', 'Rebuildable projection', 'Usage receipt'], output: 'Machine fact or configuration suggestion', review: 'Owning settings or product surface',
        before: [['Prepare bounded input', 'Select changed records, budget, binding, and output schema.']],
        during: [['Run support step', 'Execute one helper, embedding batch, or configuration curator.']],
        after: [['Record projection', 'Persist rebuildable output, failures, model identity, and freshness.']]
      }
    };

    function actionRows(group, family, rows, shared = {}) {
      return rows.map(([id, title, description, promptRefs = [], overrides = {}]) => ({
        ...actionDefaults[group],
        ...shared,
        ...overrides,
        id,
        title,
        description,
        group,
        family,
        prompts: Array.isArray(promptRefs) ? promptRefs : [promptRefs],
        evidence: overrides.evidence ?? (overrides.status === 'support' || actionDefaults[group].status === 'support'
          ? ['Registered', 'Referenced']
          : ['Registered', 'Referenced', 'Reachable'])
      }));
    }

    const capabilities = [
      ...actionRows('search', 'Search assistance', [
        ['search.query.refine', 'Vault Search · Refine query', 'Turn the current query and recent search behavior into grounded Hyper Search candidates.', ['query-rewrite-system', 'query-rewrite'], { shape: 'Single structured call', route: 'Fast Lookup', status: 'partial', output: 'Query candidates', review: 'Query candidate picker' }],
        ['search.query.parse-language', 'Vault Search · Parse natural language', 'Compile a natural-language request into Hyper Search syntax and fall back to the original text when parsing fails.', [], { shape: 'Single structured call', status: 'partial', output: 'Parsed search expression' }],
        ['search.results.rerank', 'Vault Search · LLM rerank', 'Reorder a bounded result set by semantic relevance when the LLM reranker is selected.', ['search-rerank-rank-gpt'], { shape: 'Single ranking call', route: 'Rerank helper', status: 'partial', output: 'Reordered search results' }]
      ], { surface: 'Vault Search' }),

      ...actionRows('search', 'AI Search', [
        ['analysis.vault.search', 'AI Search · Gather evidence', 'Plan a Vault investigation, use typed tools, collect sources, and submit a reviewable report plan.', ['ai-analysis-vault-harness-playbook', 'ai-analysis-proceed-nudge'], { shape: 'Multi-tier AgentLoop', route: 'Research → Stronger', output: 'Evidence set + report plan', review: 'Inline plan review' }],
        ['analysis.report.generate', 'AI Search · Generate report', 'Generate approved report sections, summary, citations, and validated Mermaid from collected evidence.', ['ai-analysis-report-section', 'ai-analysis-vault-report-summary', 'ai-analysis-mermaid-fix-system', 'ai-analysis-mermaid-fix', 'report-assign-insights'], { shape: 'Multi-step workflow', route: 'Research', output: 'Versioned analysis report' }],
        ['analysis.continue', 'AI Search · Continue analysis', 'Start another evidence round from the existing analysis context and a focused follow-up request.', ['ai-analysis-continue-system', 'ai-analysis-continue'], { shape: 'Multi-tier AgentLoop', route: 'Research → Stronger', output: 'Additional evidence round' }],

    const promptGroupLabels = {
      chat: 'Chat', searchAnalysis: 'Search & Analysis', indexing: 'Knowledge Index',
      copilot: 'Copilot / Composer', userProfile: 'User Profile'
    };
    const prompts = String(window.PEAK_PROMPT_CATALOG_TEXT ?? '')
      .trim()
      .split('\n')
      .filter(Boolean)
      .map(line => {
        const [id, stem, title, description, group, system, sourceStatus, variables, callers] = line.split('|');
        const status = sourceStatus === '引用' ? 'live' : sourceStatus === '配套' ? 'support' : 'unwired';
        return {
          id,
          stem,
          title,
          description,
          group: promptGroupLabels[group] ?? group,
          system,
          variables,
          callers,
          kind: system ? 'Executable prompt' : id.includes('system') ? 'System prompt' : 'Registered prompt',
          owners: 0,
          version: 'Built-in default; optional Vault override',
          customized: false,
          status
        };
      });

    for (const prompt of prompts) {
      const pairedPromptIds = prompts.filter(candidate => candidate.system === prompt.id).map(candidate => candidate.id);
      const ownedIds = new Set([prompt.id, ...pairedPromptIds]);
      prompt.owners = capabilities.filter(item => item.prompts.some(id => ownedIds.has(id))).length;
    }

    for (const capability of capabilities) {
      for (const promptId of capability.prompts) {
        if (prompts.some(prompt => prompt.id === promptId)) continue;
        prompts.push({
          id: promptId,
          title: promptId.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' '),
          group: capability.surface,
          kind: 'Capability prompt',
          owners: capabilities.filter(item => item.prompts.includes(promptId)).length,
          version: 'Missing from Prompt Catalog',
          customized: false,
          status: capability.status
        });
      }
    }

    let workspace = 'capabilities';
    let activeGroup = 'all';
    let activeItem = capabilities[0];
    let inspectorTab = 'overview';

    const rows = document.getElementById('rows');

      ['composer', 'file', 'Composer & Copilot'],
      ['chat', 'message', 'Chat & Generation'],
      ['intelligence', 'vault', 'Vault Intelligence'],
      ['system', 'database', 'System & background']
    ];

    function statusPill(status) {
      if (status === 'live') return '<span class="pill green">Source wired</span>';
      if (status === 'partial') return '<span class="pill amber">Partial path</span>';
      if (status === 'support') return '<span class="pill blue">Background</span>';
      if (status === 'unwired') return '<span class="pill red">Catalog only</span>';
      return `<span class="pill">${status}</span>`;
    }

    function promptPill(item) {
      if (item.customized) return '<span class="pill purple">Customized</span>';
      if (item.owners === 0 && item.status === 'unwired') return '<span class="pill red">Catalog only</span>';
      if (item.owners === 0) return '<span class="pill blue">Source helper</span>';
      return '<span class="pill">Default</span>';
    }

    function renderRail() {
      rail.innerHTML = `<div class="rail-title">AI actions</div>` +
        groups.map(([id, icon, label]) => {
          const count = id === 'all' ? capabilities.length : capabilities.filter(item => item.group === id).length;
          const active = workspace === 'capabilities' && activeGroup === id;
          return `<button class="rail-button ${active ? 'active' : ''}" data-group="${id}">${icons[icon]}<span>${label}</span><small>${count}</small></button>`;
        }).join('') +
        `<div class="rail-separator"></div>
         <div class="rail-title">Prompt library</div>
         <button class="rail-button ${workspace === 'prompts' ? 'active' : ''}" data-catalog="prompts">${icons.prompt}<span>All prompts</span></button>`;
    }

    function capabilityRow(item) {
      return `<button class="row ${activeItem?.id === item.id ? 'active' : ''}" data-id="${item.id}">
        <span class="row-icon">${icons[item.icon]}</span>
        <span class="row-copy">
          <span class="row-title">${item.title}</span>
          <span class="row-meta">${item.shape} · ${item.route}</span>
        </span>
        ${statusPill(item.status)}
      </button>`;
    }

    function groupedCapabilityRows(items) {
      const sections = [];
      for (const item of items) {
        const key = `${item.group}:${item.family}`;
        let section = sections.find(candidate => candidate.key === key);
        if (!section) {
          section = { key, group: item.group, family: item.family, items: [] };
          sections.push(section);
        }
        section.items.push(item);
      }
      return sections.map(section => {
        const groupLabel = groups.find(group => group[0] === section.group)?.[2] ?? section.group;
        const label = activeGroup === 'all' ? `${groupLabel} · ${section.family}` : section.family;
        return `<div class="family-head"><span>${label}</span><small>${section.items.length}</small></div>${section.items.map(capabilityRow).join('')}`;
      }).join('');
    }

    function promptRow(item) {
      return `<button class="row ${activeItem?.id === item.id ? 'active' : ''}" data-prompt-id="${item.id}">
        <span class="row-icon">${icons.prompt}</span>
        <span class="row-copy">
          <span class="row-title">${item.title}</span>
          <span class="row-meta">${item.group} · Used by ${item.owners} AI action${item.owners === 1 ? '' : 's'}</span>
        </span>
        ${promptPill(item)}
      </button>`;
    }

    function renderRows() {
      const query = searchInput.value.trim().toLowerCase();
      if (workspace === 'capabilities') {
        listTitle.textContent = activeGroup === 'all' ? 'All AI actions' : groups.find(item => item[0] === activeGroup)?.[2] ?? 'AI actions';
        listDescription.textContent = `${filteredCount(activeGroup)} source-backed behaviors, grouped by the product action a person recognizes.`;
        const filtered = capabilities.filter(item => {
          const groupMatch = activeGroup === 'all' || item.group === activeGroup;
          return groupMatch && [item.id, item.title, item.surface, item.shape, item.route].join(' ').toLowerCase().includes(query);
        });
        rows.innerHTML = filtered.length ? groupedCapabilityRows(filtered) : '<div class="empty">No AI action matches this filter.</div>';
        return;
      }

      listTitle.textContent = 'All prompts';
      listDescription.textContent = `All ${prompts.length} built-in Prompt templates are flat and searchable. AI action ownership is derived from the catalog.`;
      const filtered = prompts.filter(item => [item.id, item.title, item.group, item.kind].join(' ').toLowerCase().includes(query));
      rows.innerHTML = filtered.length ? filtered.map(promptRow).join('') : '<div class="empty">No prompt matches this search.</div>';
    }

    function filteredCount(groupId) {
      return groupId === 'all' ? capabilities.length : capabilities.filter(item => item.group === groupId).length;
    }

    function inspectorHeader(item, type) {
      const isCapability = type === 'capability';
      const subtitle = type === 'capability'
        ? item.description
        : `${item.description ?? 'Registered Prompt template'} ${item.owners ? `Mapped to ${item.owners} AI action${item.owners === 1 ? '' : 's'}.` : 'No top-level AI action is mapped in this design fixture.'}`;
      return `<div class="inspector-head">
        <div class="breadcrumbs">${isCapability ? item.surface : `Prompt Library · ${item.group}`}</div>
        <div class="inspector-title-row"><h1>${item.title}</h1>${isCapability ? statusPill(item.status) : promptPill(item)}</div>
        <p class="inspector-subtitle">${subtitle}</p>
        ${isCapability ? `<div class="inspector-tabs">
          <button class="inspector-tab ${inspectorTab === 'overview' ? 'active' : ''}" data-tab="overview">Behavior</button>
          <button class="inspector-tab ${inspectorTab === 'config' ? 'active' : ''}" data-tab="config">Configuration</button>
        </div>` : ''}
      </div>`;
    }

    function renderCapabilityInspector(item) {
      const promptList = item.prompts.length
        ? item.prompts.map(id => {
          const prompt = prompts.find(candidate => candidate.id === id);
          return `<div class="prompt-box"><div class="prompt-head"><strong>${prompt?.title ?? id}</strong><button class="link-button" data-open-prompt="${id}">Edit in Prompt Library</button></div><div class="prompt-body">${prompt?.kind ?? 'Capability prompt'} · ${prompt?.version ?? 'Built-in'}</div></div>`;
        }).join('')
        : '<div class="notice">' + icons.prompt + '<span>This action has no editable text prompt. Its behavior comes from the selected model or embedding service.</span></div>';
      inspector.innerHTML = inspectorHeader(item, 'capability') + `
        <section class="panel ${inspectorTab === 'overview' ? 'active' : ''}" data-panel="overview">
          <div class="section">
            <h2>Expected behavior</h2>
            <div class="cards">
              <div class="card"><strong>What you get</strong><span>${item.success}</span></div>
              <div class="card"><strong>Safety boundary</strong><span>${item.mustNot}</span></div>
            </div>
          </div>
          <div class="section">
            <h2>At a glance</h2>
            <dl class="facts">
              <dt>Available in</dt><dd>${item.surface}</dd>
              <dt>Response style</dt><dd>${item.shape}</dd>
              <dt>Produces</dt><dd>${item.output}</dd>
              <dt>You review it in</dt><dd>${item.review}</dd>
            </dl>
          </div>
        </section>
        <section class="panel ${inspectorTab === 'config' ? 'active' : ''}" data-panel="config">
          <div class="section">
            <h2>Model</h2>
            <label class="route active"><input type="radio" name="model-policy" checked><span><strong>Use the AI Setup default</strong><span>Follows future changes to the shared model setting.</span></span><span class="route-effective">Current<code>${item.route}</code></span></label>
            <label class="route"><input type="radio" name="model-policy"><span><strong>Choose a model for this action</strong><span>Overrides the default only for this AI action.</span></span><button class="action-button">Choose model</button></label>
          </div>
          <div class="section"><h2>Prompt instructions</h2>${promptList}</div>
        </section>`;
    }

    function renderPromptInspector(item) {
      inspector.innerHTML = inspectorHeader(item, 'prompt') + `<section class="panel active">
        <div class="section">
          <h2>Usage</h2>
          <dl class="facts">
            <dt>Category</dt><dd>${item.group}</dd>
            <dt>Used by</dt><dd>${item.owners ? `${item.owners} AI action${item.owners === 1 ? '' : 's'}` : 'No mapped top-level AI action'}</dd>
            <dt>Source</dt><dd>${item.version}</dd>
          </dl>
        </div>
        <div class="section">
          <h2>Prompt instructions</h2>
          <div class="prompt-box"><div class="prompt-head"><strong>Vault override</strong><button class="link-button">View built-in default</button></div><textarea class="prompt-editor" placeholder="No Vault override. Add instructions here to override the built-in default."></textarea><div class="button-row"><button class="action-button" disabled>Reset to default</button><button class="action-button primary">Save override</button></div></div>
        </div>
        ${item.owners > 1 ? `<div class="notice">${icons.prompt}<span>This prompt is shared. Saving an override changes the instructions for all ${item.owners} actions that use it.</span></div>` : ''}
      </section>`;
    }

    function renderInspector() {
      if (workspace === 'capabilities') return renderCapabilityInspector(activeItem);
      return renderPromptInspector(activeItem);
    }

    function renderAll() {
      renderRail();
      renderRows();
      renderInspector();
    }

    document.addEventListener('click', event => {
      const catalogButton = event.target.closest('[data-catalog="prompts"]');
      if (catalogButton) {
        workspace = 'prompts';
        activeItem = prompts[0];
        inspectorTab = 'overview';
        searchInput.value = '';
        renderAll();
        return;
      }

      const groupButton = event.target.closest('[data-group]');
      if (groupButton) {
        workspace = 'capabilities';
        activeGroup = groupButton.dataset.group;
        const visible = capabilities.filter(item => activeGroup === 'all' || item.group === activeGroup);
        if (visible.length) activeItem = visible[0];
        inspectorTab = 'overview';
        searchInput.value = '';
        renderAll();
        return;
      }

      const row = event.target.closest('[data-id]');
      if (row) {
        activeItem = capabilities.find(item => item.id === row.dataset.id);
        inspectorTab = 'overview';
        renderRows();
        renderInspector();
        return;
      }

      const openPromptButton = event.target.closest('[data-open-prompt]');
      if (openPromptButton) {
        const prompt = prompts.find(item => item.id === openPromptButton.dataset.openPrompt);
        if (!prompt) return;
        workspace = 'prompts';
        activeItem = prompt;
        searchInput.value = '';
        renderAll();
        return;
      }

      const promptRowButton = event.target.closest('[data-prompt-id]');
      if (promptRowButton) {
        activeItem = prompts.find(item => item.id === promptRowButton.dataset.promptId);
        renderRows();
        renderInspector();
        return;
      }

      const tab = event.target.closest('[data-tab]');
      if (tab) {
        inspectorTab = tab.dataset.tab;
        renderInspector();
      }
    });

    searchInput.addEventListener('input', renderRows);
    renderAll();
  </script>
</body>
</html>
